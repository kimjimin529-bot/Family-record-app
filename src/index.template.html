<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가족 기록장 · 태블릿 가로형</title>
<meta name="theme-color" content="#FFF8EE">
<meta name="description" content="초코하임과 호도리의 포근한 가족 기록장 — 태블릿 가로 화면에 맞춘 버전">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="34" r="21" fill="#FFFCF6" stroke="#EBD3B6" stroke-width="2.6"/>
          <circle cx="19" cy="18" r="7.5" fill="#FFF3E2" stroke="#EBD3B6" stroke-width="2.4"/>
          <circle cx="45" cy="18" r="7.5" fill="#FFF3E2" stroke="#EBD3B6" stroke-width="2.4"/>
          <ellipse cx="25" cy="33" rx="2.2" ry="2.9" fill="#6B5340"/>
          <ellipse cx="39" cy="33" rx="2.2" ry="2.9" fill="#6B5340"/>
          <ellipse cx="18" cy="39" rx="3.8" ry="2.4" fill="#F9C3C9"/>
          <ellipse cx="46" cy="39" rx="3.8" ry="2.4" fill="#F9C3C9"/>
          <path d="M29 39q3 3.4 6 0" fill="none" stroke="#6B5340" stroke-width="2" stroke-linecap="round"/>
          <path d="M47 12l2.2 4.6 5 .7-3.6 3.4.9 4.9-4.5-2.4-4.5 2.4.9-4.9-3.6-3.4 5-.7z" fill="#FFD86B" stroke="#E9B94A" stroke-width="1.4"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">우리 가족 기록장</span>
        <span class="brand-sub">우리집의 포근한 하루</span>
      </span>
    </div>

    <div class="side-label">구성원</div>
    <div class="members" id="memberSwitch"></div>

    <div class="side-label">메뉴</div>
    <nav class="nav" id="nav" aria-label="메뉴"></nav>

    <div class="side-foot">
      <div class="save-note"><span class="save-dot"></span><span id="saveNoteText">자동 저장 중…</span></div>
      <div class="backup-row">
        <button class="mini-btn" data-act="backup:export" title="JSON으로 내보내기"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10.4l4 4 4-4"/><path d="M4.8 18.4h14.4"/></svg></span><span>내보내기</span></button>
        <button class="mini-btn" data-act="backup:import" title="JSON 불러오기"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V5"/><path d="M8 8.6l4-4 4 4"/><path d="M4.8 18.4h14.4"/></svg></span><span>불러오기</span></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-scroll">
      <header class="topbar">
        <div class="tb-text">
          <h1 class="tb-title" id="tbTitle">우리집 홈</h1>
          <div class="tb-sub" id="tbSub">오늘의 날씨와 가족 소식을 한눈에</div>
        </div>
        <div class="mobile-members" id="mobileMembers"></div>
        <div class="tb-right">
          <div class="date-chip" id="dateChip"></div>
        </div>
      </header>
      <section id="page"></section>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/*__JS__*/
</script>
</body>
</html>
