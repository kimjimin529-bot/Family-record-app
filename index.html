<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFDF1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="우리 가족의 루틴, 공부, 용돈, 도장판, 채팅을 한 곳에 담은 포근한 가족 기록장" />
<title>우리 가족 기록장 🐣</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='54' r='34' fill='%23fff' stroke='%234A3A33' stroke-width='4'/%3E%3Ccircle cx='38' cy='50' r='4' fill='%234A3A33'/%3E%3Ccircle cx='62' cy='50' r='4' fill='%234A3A33'/%3E%3Cpath d='M45 60q5 6 10 0' fill='none' stroke='%234A3A33' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   우리 가족 기록장 · cozy pastel theme
   ============================================================ */

:root{
  --bg-top:#FFFDF1;
  --bg-mid:#FFFBE6;
  --bg-bot:#FFF6D2;

  --card:#FFFEF9;
  --card-warm:#FFFCF2;
  --ink:#6B5A4C;
  --ink-soft:#9A8878;
  --ink-faint:#BCAA98;
  --title:#C0837F;
  --title-deep:#B3746F;

  --line:#EFE3C9;
  --line-soft:#F5EBD8;
  --line-dash:#EADCC0;

  --mint:#E7F6EC;
  --mint-deep:#CFEBD8;
  --mint-ink:#5E8F6C;

  --pink:#FDECF1;
  --pink-deep:#F6D7E2;
  --pink-ink:#BE7B90;

  --blue:#EDF4FE;
  --blue-deep:#D9E8FA;
  --blue-ink:#5C86BC;

  --lav:#F2EEFB;
  --lav-deep:#E3DAF5;
  --lav-ink:#8B7AB8;

  --peach:#FFF1E3;
  --peach-deep:#F9DFC4;
  --peach-ink:#B98354;

  --sun:#F7C948;
  --star:#F5C244;

  --checkbox:#7FBF9B;
  --checkbox-blue:#5B93D6;

  --radius-lg:24px;
  --radius:20px;
  --radius-sm:14px;
  --shadow:0 6px 18px rgba(186,157,112,.10);
  --shadow-soft:0 3px 10px rgba(186,157,112,.08);
  --shadow-pill:0 3px 9px rgba(180,150,110,.13);

  --font-title:'Jua','Noto Sans KR',system-ui,'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
  --font-body:'Pretendard','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(120% 60% at 50% 0%, #FFFEF6 0%, rgba(255,254,246,0) 60%),
    linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);
  background-attachment:fixed;
  min-height:100vh;
  font-size:15px;
  line-height:1.45;
  letter-spacing:-0.01em;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);}
input::placeholder,textarea::placeholder{color:var(--ink-faint);}
img,svg{display:block;}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}

/* ---------- app shell ---------- */
.app{
  width:100%;
  max-width:468px;
  margin:0 auto;
  min-height:100vh;
  padding:14px 16px 108px;
  position:relative;
  display:flex;
  flex-direction:column;
}
@media(min-width:560px){
  body{background:linear-gradient(180deg,#FBF3DE 0%,#F6EBCF 100%);}
  .app{
    background:
      radial-gradient(120% 40% at 50% 0%, #FFFEF7 0%, rgba(255,254,247,0) 70%),
      linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 60%,var(--bg-bot) 100%);
    box-shadow:0 18px 60px rgba(160,130,90,.18);
    border-radius:32px;
    margin:18px auto;
    min-height:calc(100vh - 36px);
    padding-top:18px;
  }
}

/* ---------- header ---------- */
.app-header{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px 10px;
  align-items:start;
  margin-bottom:14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.brand-badge{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:50%;
  background:linear-gradient(160deg,#FFFFFF,#FFF6E2);
  border:1.5px solid var(--line);
  box-shadow:var(--shadow-pill);
  display:grid;place-items:center;
  overflow:hidden;
}
.brand-badge svg{width:32px;height:32px;}
.brand-title{
  font-family:var(--font-title);
  font-size:25px;
  line-height:1.15;
  color:var(--title);
  letter-spacing:-0.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.header-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:#FFFFFF;
  border:1.5px solid var(--line);
  box-shadow:var(--shadow-pill);
  display:grid;place-items:center;
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:20px;height:20px;}
.icon-btn .dot{position:absolute;}

.date-row{
  grid-column:1/-1;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-top:2px;
}
.date-block{min-width:0;}
.date-main{font-size:15px;font-weight:600;color:#7D6C5C;}
.date-sub{font-size:13.5px;color:#A79278;}
.header-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  flex:0 0 auto;
  background:#FFFFFF;
  border:1.5px solid var(--line);
  border-radius:999px;
  padding:6px 12px;
  font-size:12.5px;
  font-weight:600;
  color:#8C7A63;
  box-shadow:var(--shadow-soft);
  white-space:nowrap;
  margin-top:2px;
}
.header-pill .spark{font-size:12px;}

/* ---------- generic card ---------- */
.card{
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
}
.card.tight{padding:13px;}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.card-title{
  font-family:var(--font-title);
  font-size:18px;
  color:#7B6553;
  display:flex;
  align-items:center;
  gap:6px;
  letter-spacing:-0.01em;
  line-height:1.3;
}
.card-desc{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.5;
  margin-bottom:12px;
}
.section-title{
  font-family:var(--font-title);
  font-size:19px;
  color:#7B6553;
  display:flex;
  align-items:center;
  gap:7px;
  margin:4px 2px 10px;
}
.page-head{margin:0 2px 12px;}
.page-head h2{
  font-family:var(--font-title);
  font-size:21px;
  color:#7B6553;
  display:flex;align-items:center;gap:8px;
  margin-bottom:4px;
}
.page-head p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-radius:14px;
  padding:11px 14px;
  font-size:14px;
  font-weight:700;
  border:1.5px solid var(--line);
  background:#FFFFFF;
  color:#7A6653;
  box-shadow:var(--shadow-soft);
  transition:transform .12s ease, filter .12s ease;
  line-height:1.2;
}
.btn:active{transform:scale(.97);filter:brightness(.98);}
.btn-primary{
  background:linear-gradient(180deg,#DDF3E3,#CBEBd6);
  border-color:#BFE4CB;
  color:#4F8160;
}
.btn-blue{
  background:linear-gradient(180deg,#DCEBFB,#CBE0F7);
  border-color:#BED8F2;
  color:#4C7AB0;
}
.btn-pink{
  background:linear-gradient(180deg,#FBE0E9,#F7D2E0);
  border-color:#F0C6D6;
  color:#B76A84;
}
.btn-ghost{background:#FFFDF8;}
.btn-sm{padding:8px 11px;font-size:13px;border-radius:12px;}
.btn-block{display:flex;width:100%;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn-row.even > *{flex:1 1 0;min-width:0;}

.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:700;
  background:#FFFFFF;
  border:1.5px solid var(--line);
  color:#8A7660;
  white-space:nowrap;
}
.chip-soft{background:#FBF5E6;border-color:#F0E5CC;}
.chip-mint{background:#EAF7EE;border-color:#D2EBDC;color:#5C8F6D;}
.chip-blue{background:#EBF3FD;border-color:#D7E7F8;color:#5C86BC;}
.chip-pink{background:#FDEDF2;border-color:#F7DCE5;color:#BA7C91;}
.chip-peach{background:#FEF1E2;border-color:#F7DFC6;color:#AC7C4F;}
.chip-lav{background:#F3EFFC;border-color:#E5DCF6;color:#8A79B6;}
.chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;}

/* ---------- home ---------- */
.weather-card{
  background:linear-gradient(135deg,#EAF5FE 0%,#F4FAFF 48%,#FDFBF3 100%);
  border:1.5px solid #DAE8F6;
  border-radius:var(--radius);
  padding:13px 14px;
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
}
.weather-main{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.weather-icon{width:32px;height:32px;flex:0 0 32px;}
.weather-temp{
  font-family:var(--font-title);
  font-size:22px;
  color:#5F7288;
  letter-spacing:-0.02em;
}
.weather-city{font-size:14px;font-weight:700;color:#6B7C90;}
.weather-desc{font-size:13.5px;color:#8395A8;font-weight:600;}
.weather-range{font-size:12.5px;color:#96A6B7;white-space:nowrap;}
.weather-fine{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:700;color:#8A7660;
  background:#FDF8EC;border:1.5px solid #F1E6CE;border-radius:999px;padding:4px 9px;
}
.weather-row2{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:9px;
}
.mask-pill{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:5px;
  background:#FFFFFF;border:1.5px solid #EFE4CC;border-radius:999px;
  padding:5px 10px;font-size:12px;font-weight:700;color:#8A7660;
  box-shadow:var(--shadow-soft);
}
.weather-note{
  font-size:12px;color:var(--ink-faint);
  display:flex;align-items:center;gap:6px;
}
.weather-skel{height:14px;border-radius:8px;background:rgba(190,215,235,.35);}
.link-btn{
  font-size:12px;font-weight:700;color:#7E9BC0;text-decoration:underline;
  text-underline-offset:2px;
}

.family-card{
  background:linear-gradient(160deg,#EAF8EF 0%,#EFFBF2 45%,#FBFDF6 100%);
  border:1.5px solid #D5EDDD;
  border-radius:var(--radius-lg);
  padding:12px;
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
}
.family-card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 8px;
}
.family-card-head .card-title{font-size:16.5px;}
.member-list{display:flex;flex-direction:column;gap:9px;}
.member-row{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#FFFFFF,#FFFDF6);
  border:1.5px solid #F3EBD9;
  border-radius:18px;
  padding:10px 12px;
  box-shadow:0 2px 7px rgba(186,157,112,.07);
}
.avatar{
  width:52px;height:52px;flex:0 0 52px;
  border-radius:16px;
  background:linear-gradient(160deg,#FFFFFF,#FFF7E8);
  border:1.5px solid #F1E6D0;
  display:grid;place-items:center;
  overflow:hidden;
  box-shadow:inset 0 -3px 6px rgba(230,210,180,.25);
}
.avatar svg{width:46px;height:46px;}
.avatar.sm{width:38px;height:38px;flex-basis:38px;border-radius:12px;}
.avatar.sm svg{width:34px;height:34px;}
.avatar.xs{width:30px;height:30px;flex-basis:30px;border-radius:10px;}
.avatar.xs svg{width:27px;height:27px;}
.member-main{min-width:0;flex:1 1 auto;}
.member-name{
  font-family:var(--font-title);
  font-size:18px;
  color:#6E5B4B;
  line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.member-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.member-stats{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto;}
.stat-line{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:800;color:#7A6650;}
.stat-line .emoji{font-size:14px;}
.stat-line svg{width:15px;height:15px;flex:0 0 15px;}
.head-star{display:inline-flex;}
.head-star svg{width:21px;height:21px;}
.btn svg,.chip svg{width:15px;height:15px;flex:0 0 15px;}
.stat-line.money{font-size:12.5px;color:#B08055;font-weight:800;}
.star-count{font-size:16px;font-family:var(--font-title);color:#9A7B4E;}

/* stamp board */
.stamp-card{
  background:linear-gradient(150deg,#FDEFF3 0%,#FBF0F6 40%,#F4F1FC 100%);
  border:1.5px solid #F2DFE7;
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
}
.stamp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.stamp-title{font-family:var(--font-title);font-size:18px;color:#9A6E80;display:flex;align-items:center;gap:6px;}
.streak-pill{
  display:inline-flex;align-items:center;gap:4px;
  background:#FFFFFF;border:1.5px solid #F5DDE4;border-radius:999px;
  padding:5px 11px;font-size:12.5px;font-weight:800;color:#C07A6A;
  box-shadow:var(--shadow-soft);white-space:nowrap;
}
.stamp-desc{font-size:12.5px;color:#A1879A;line-height:1.5;margin-bottom:12px;}
.member-switch{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.member-switch::-webkit-scrollbar{display:none;}
.switch-chip{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:14px;padding:6px 11px 6px 6px;
  background:#FFFFFF;border:1.5px solid #F0E2E7;
  font-size:13px;font-weight:700;color:#9A8878;
  white-space:nowrap;box-shadow:var(--shadow-soft);
}
.switch-chip svg{width:26px;height:26px;}
.switch-chip.active{
  background:linear-gradient(180deg,#FFF6FA,#FDECF3);
  border-color:#EEB9CB;color:#B3697F;
  box-shadow:0 3px 10px rgba(220,160,180,.22);
}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
.day-cell{display:flex;flex-direction:column;align-items:center;gap:5px;}
.day-label{font-size:11px;font-weight:700;color:#B49C9F;}
.day-label.sun{color:#D38B8B;}
.day-label.sat{color:#8FA9C9;}
.day-slot{
  width:100%;aspect-ratio:1/1;max-width:40px;
  border-radius:50%;
  border:2px dashed #E8D8C7;
  background:rgba(255,255,255,.55);
  display:grid;place-items:center;
  position:relative;
  font-size:11px;color:#C6B49F;
}
.day-slot.has-stamp{
  border-style:solid;border-color:#FADFA8;
  background:linear-gradient(180deg,#FFF6DE,#FFEFC9);
  box-shadow:0 2px 7px rgba(230,190,110,.28);
}
.day-slot.has-stamp::after{
  content:'✓';
  position:absolute;right:-1px;bottom:-2px;
  font-size:10px;font-weight:900;color:#D89B3E;
  background:#FFFFFF;border-radius:50%;
  width:14px;height:14px;display:grid;place-items:center;
  border:1px solid #F3DFB2;
}
.day-slot.today{
  border-style:solid;border-color:#B7D8F2;
  background:linear-gradient(180deg,#FFFFFF,#F2FAFF);
  box-shadow:0 2px 8px rgba(150,190,230,.3);
  border-width:2.5px;
}
.day-slot.today svg{width:30px;height:30px;}
.day-slot.today.is-stamped{border-color:#F0C97E;}
.stamp-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.stamp-foot .btn{flex:1 1 0;min-width:132px;}

/* mission */
.mission-card{
  background:linear-gradient(150deg,#FDEEF2 0%,#FEF4EF 55%,#FFF9EC 100%);
  border:1.5px solid #F6DFE5;
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
}
.mission-emoji{font-size:26px;line-height:1;margin:2px 0 8px;}
.mission-text{
  font-family:var(--font-title);
  font-size:20px;
  color:#7C5F58;
  margin-bottom:13px;
  line-height:1.3;
}
.mission-foot{font-size:11.5px;color:#AB95A0;margin-top:10px;line-height:1.45;}

/* ---------- page transitions / tabs ---------- */
.page{display:none;animation:fadeUp .22s ease both;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){
  .page{animation:none;}
}

/* ---------- bottom nav ---------- */
.tabbar-wrap{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:40;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,252,240,0) 0%,rgba(255,250,235,.92) 34%,#FFF8E8 100%);
  pointer-events:none;
}
.tabbar{
  pointer-events:auto;
  max-width:452px;
  margin:0 auto;
  background:rgba(255,253,244,.97);
  border:1.5px solid var(--line);
  border-radius:22px;
  box-shadow:0 8px 24px rgba(176,145,100,.18);
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:1px;
  padding:6px 4px;
  backdrop-filter:blur(8px);
}
@media(max-width:365px){
  .brand-title{font-size:21px;}
  .tabbar{gap:0;padding:5px 2px;}
  .tab svg{width:19px;height:19px;}
  .tab{font-size:9.5px;padding:5px 0 4px;border-radius:13px;}
  #page-chat .chat-card{height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:380px;}
  .week-strip{gap:2px;}
  .day-slot.today svg{width:26px;height:26px;}
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0 5px;
  border-radius:15px;
  color:#A79480;
  font-size:10.5px;
  font-weight:700;
  transition:background .15s ease,color .15s ease;
  min-width:0;
}
.tab svg{width:22px;height:22px;}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.tab.active{
  background:linear-gradient(180deg,#FFF2C4,#FFE9A8);
  color:#8E6A2E;
  box-shadow:0 2px 7px rgba(220,180,90,.25);
}
.tab.active svg{filter:saturate(1.15);}

@media(min-width:560px){
  .tabbar-wrap{position:sticky;bottom:14px;padding-bottom:14px;background:none;}
}

/* ---------- checklists ---------- */
.member-block{
  border:1.5px dashed var(--line-dash);
  border-radius:20px;
  padding:12px;
  margin-bottom:11px;
  background:#FFFDF8;
}
.member-block.choco{background:linear-gradient(170deg,#FFFAEC,#FFF6DF);border-color:#EFDFBC;}
.member-block.hodo{background:linear-gradient(170deg,#F2FBF4,#E9F8EE);border-color:#D3EBD9;}
.member-block.mom{background:linear-gradient(170deg,#FEF2F7,#FBEBF3);border-color:#F2D8E5;}
.block-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1.5px dashed var(--line-dash);margin-bottom:4px;}
.block-head .member-name{font-size:17px;}
.block-head .avatar{width:44px;height:44px;flex-basis:44px;border-radius:14px;}
.block-head .avatar svg{width:39px;height:39px;}
.block-count{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.block-count b{color:#8A7358;}

.task-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 0;
  border-bottom:1.5px dashed var(--line-soft);
}
.task-row:last-of-type{border-bottom:none;}
.check{
  width:24px;height:24px;flex:0 0 24px;
  border-radius:8px;
  border:2px solid #D9CBB4;
  background:#FFFFFF;
  display:grid;place-items:center;
  color:#FFFFFF;
  transition:all .15s ease;
}
.check svg{width:15px;height:15px;opacity:0;}
.check.on{background:var(--checkbox);border-color:var(--checkbox);}
.check.on.blue{background:var(--checkbox-blue);border-color:var(--checkbox-blue);}
.check.on svg{opacity:1;}
.task-text{
  flex:1 1 auto;min-width:0;
  font-size:14.5px;color:#6E5C4C;
  word-break:keep-all;overflow-wrap:anywhere;
  line-height:1.4;
}
.task-row.done .task-text{color:#B4A594;text-decoration:line-through;text-decoration-thickness:1.5px;}
.row-actions{display:flex;gap:5px;flex:0 0 auto;}
.mini-btn{
  width:30px;height:30px;border-radius:9px;
  border:1.5px solid var(--line);
  background:#FFFDF8;
  display:grid;place-items:center;
  font-size:13px;
  color:#A08D78;
  transition:transform .12s ease,background .12s;
}
.mini-btn:active{transform:scale(.93);}
.mini-btn.pin.on{background:#FFF1C9;border-color:#F0D48C;}
.mini-btn.del{color:#C98B8B;}
.add-row{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:13px;
  border:1.5px dashed #DDCCAF;
  background:rgba(255,255,255,.6);
  font-size:13.5px;font-weight:700;color:#A18A6D;
  transition:background .15s ease;
}
.add-row:hover{background:#FFFFFF;}
.add-row:active{transform:scale(.99);}
.inline-input{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#FFFFFF;
  padding:10px 12px;
  font-size:14.5px;
  outline:none;
}
.inline-input:focus{border-color:#DCC49C;box-shadow:0 0 0 3px rgba(240,225,190,.5);}

/* ---------- study plan ---------- */
.study-card{
  background:linear-gradient(160deg,#EDF5FE 0%,#F3F8FF 55%,#FDFCF6 100%);
  border:1.5px solid #DEE9F8;
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
}
.study-desc{font-size:12.5px;color:#8A9AAD;line-height:1.5;margin:2px 0 12px;}
.study-top-btns{display:flex;gap:8px;margin-bottom:13px;}
.study-top-btns .btn{flex:1 1 0;font-size:13px;padding:10px 8px;background:#FFFFFF;}
.progress-wrap{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.progress-track{
  flex:1 1 auto;height:11px;border-radius:999px;
  background:#EEE7D4;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,#9BC4EC,#7FADE2);
  transition:width .3s ease;
}
.progress-label{font-size:12.5px;font-weight:800;color:#7C90A6;white-space:nowrap;}

/* timer */
.timer-box{
  border:1.5px dashed #CFDFF1;
  border-radius:18px;
  background:rgba(255,255,255,.72);
  padding:13px;
  margin-bottom:14px;
}
.timer-tabs{display:flex;gap:5px;margin-bottom:10px;background:#EEF3FB;border-radius:999px;padding:4px;}
.timer-tab{
  flex:1 1 0;
  border-radius:999px;
  padding:7px 4px;
  font-size:12.5px;font-weight:800;color:#94A6BB;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.timer-tab.active{background:#FFFFFF;color:#5C86BC;box-shadow:0 2px 6px rgba(150,180,215,.25);}
.timer-caption{font-size:11.5px;color:#9DAEBD;font-weight:700;margin-bottom:2px;}
.timer-display{
  font-family:var(--font-title);
  font-size:46px;
  line-height:1.05;
  color:#3F5F8C;
  letter-spacing:0.02em;
  text-align:center;
  font-variant-numeric:tabular-nums;
  margin:2px 0 10px;
}
.timer-display.small{font-size:34px;}
.timer-controls{display:flex;gap:8px;}
.timer-controls .btn{flex:1 1 0;}
.timer-presets{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.preset{
  border-radius:999px;padding:7px 14px;
  border:1.5px solid #DCE7F5;background:#FFFFFF;
  font-size:13px;font-weight:800;color:#7E93AB;
}
.preset.active{background:linear-gradient(180deg,#E3EEFB,#D6E7FA);border-color:#BFD6F0;color:#4C7AB0;}
.custom-row{display:flex;gap:6px;margin-top:8px;}
.custom-row input{
  flex:1 1 auto;min-width:0;
  border:1.5px dashed #D6E1F0;border-radius:12px;background:#FFFFFF;
  padding:8px 11px;font-size:13.5px;outline:none;
}
.custom-row .btn{flex:0 0 auto;font-size:13px;padding:8px 12px;}
.timer-status{font-size:11.5px;color:#9DAEBD;text-align:center;margin-top:8px;min-height:14px;}
.timer-ring{display:flex;align-items:center;justify-content:center;gap:10px;}

/* study kid block */
.study-kid{
  border:1.5px solid #E4ECF6;
  border-radius:18px;
  background:#FFFFFF;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(150,180,215,.08);
}
.study-kid-head{display:flex;align-items:center;gap:9px;padding-bottom:9px;border-bottom:1.5px dashed #EAF0F7;margin-bottom:4px;}
.study-kid-head .member-name{font-size:16.5px;color:#5F6E80;}
.study-kid-head .block-count{color:#96A6B8;}
.study-bal{
  margin-left:auto;
  background:linear-gradient(180deg,#FFF8E4,#FFF1CE);
  border:1.5px solid #F2DFAE;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;font-weight:800;color:#A98342;
  white-space:nowrap;
}
.study-progress{display:flex;align-items:center;gap:8px;margin:9px 0 4px;}
.study-progress .progress-track{height:9px;background:#EDF2F8;}
.study-progress .progress-fill{background:linear-gradient(90deg,#9CC0EA,#6E9FD9);}
.study-item{
  display:flex;align-items:center;gap:9px;
  padding:10px 0;
  border-bottom:1.5px dashed #EFF4FA;
  flex-wrap:wrap;
}
.study-item:last-of-type{border-bottom:none;}
.study-item .task-text{font-size:14px;flex:1 1 120px;}
.tag-pill{
  background:#FDF4DF;border:1.5px solid #F3E4BE;color:#A98B4B;
  border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap;
}
.reward-pill{
  display:inline-flex;align-items:center;gap:3px;
  background:#FDF7E5;border:1.5px solid #F2E3B9;color:#A98342;
  border-radius:999px;padding:2px 8px 2px 6px;font-size:11px;font-weight:800;white-space:nowrap;
}
.study-item .row-actions{margin-left:auto;}
.pin-btn{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-size:14px;border:1.5px solid transparent;
}
.pin-btn svg{width:15px;height:15px;}
.pin-btn.on{background:#FFF0C6;border-color:#F1D98F;}

/* ---------- meals ---------- */
.meal-card{
  border:1.5px solid var(--line);
  border-radius:20px;
  padding:13px;
  margin-bottom:11px;
  background:var(--card);
  box-shadow:var(--shadow-soft);
}
.meal-card.breakfast{background:linear-gradient(160deg,#FFF8E3,#FFFDF6);border-color:#F3E8C8;}
.meal-card.lunch{background:linear-gradient(160deg,#EFF9F0,#FCFEFA);border-color:#D9EEDD;}
.meal-card.dinner{background:linear-gradient(160deg,#FDF0F4,#FFFBFC);border-color:#F5DCE5;}
.meal-card.snack{background:linear-gradient(160deg,#F1F2FD,#FBFBFF);border-color:#E1E2F6;}
.meal-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.meal-name{font-family:var(--font-title);font-size:16.5px;color:#7B6553;}
.meal-empty{font-size:12.5px;color:var(--ink-faint);padding:4px 0 8px;}
.meal-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}
.meal-item{
  display:inline-flex;align-items:center;gap:5px;
  background:#FFFFFF;border:1.5px solid var(--line);
  border-radius:12px;padding:5px 7px 5px 10px;
  font-size:13px;color:#75614F;
  max-width:100%;
}
.meal-item button{color:#C0AA95;font-size:12px;padding:0 2px;line-height:1;}
.meal-add{display:flex;gap:6px;}
.meal-add input{
  flex:1 1 auto;min-width:0;
  border:1.5px dashed #E4D5BC;border-radius:12px;background:#FFFFFF;
  padding:8px 10px;font-size:13.5px;outline:none;
}
.meal-add .btn{flex:0 0 auto;padding:8px 12px;font-size:13px;}
.suggest-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.suggest{
  font-size:13px;padding:7px 11px;border-radius:12px;
  background:#FFFFFF;border:1.5px solid var(--line);
  color:#8A7560;box-shadow:var(--shadow-soft);
}
.dice-btn{width:100%;margin-bottom:12px;}

/* ---------- schedule ---------- */
.cal-card{padding:14px 12px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px;}
.cal-month{font-family:var(--font-title);font-size:17px;color:#7B6553;}
.cal-nav{display:flex;gap:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:#B4A28C;padding:4px 0;}
.cal-dow.sun{color:#D08E8E;}
.cal-cell{
  aspect-ratio:1/1;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12.5px;color:#7F6D5B;position:relative;
}
.cal-cell.other{color:#D8CCBC;}
.cal-cell.today{background:#FFF1C4;font-weight:800;color:#9A762E;}
.cal-cell.has-event{background:#F2F8F2;}
.cal-cell.today.has-event{background:linear-gradient(180deg,#FFF3C8,#FFEBAF);}
.cal-dot{width:4px;height:4px;border-radius:50%;background:#8FBE9B;}
.cal-cell.has-event .cal-dot{background:#7FB592;}
.event-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 0;border-bottom:1.5px dashed var(--line-soft);
}
.event-row:last-child{border-bottom:none;}
.event-date{
  flex:0 0 44px;text-align:center;
  background:#FFF6E0;border:1.5px solid #F0E2C0;border-radius:12px;
  padding:5px 2px;
}
.event-date .d{font-family:var(--font-title);font-size:16px;color:#96794A;line-height:1.1;}
.event-date .m{font-size:10px;color:#B39C71;font-weight:700;}
.event-main{flex:1 1 auto;min-width:0;}
.event-title{font-size:14.5px;font-weight:700;color:#6E5C4C;line-height:1.35;}
.event-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.event-main .row-actions{align-self:flex-start;}
.empty-note{
  text-align:center;color:var(--ink-faint);font-size:13px;
  padding:18px 8px;
}

/* ---------- health ---------- */
.health-card{
  border:1.5px solid var(--line);
  border-radius:20px;padding:13px;
  background:linear-gradient(165deg,#F4FAF5,#FFFEF8);
  box-shadow:var(--shadow-soft);margin-bottom:11px;
}
.health-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.health-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 0;border-bottom:1.5px dashed #EEF2E9;
}
.health-row:last-child{border-bottom:none;}
.health-label{font-size:13px;font-weight:700;color:#7E8B75;flex:0 0 78px;}
.toggle-pill{
  border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;
  border:1.5px solid var(--line);background:#FFFFFF;color:#A2917C;
}
.toggle-pill.on{background:#E4F5E8;border-color:#C6E7CF;color:#578D68;}
.water-btn{
  width:28px;height:28px;border-radius:50%;background:#EAF4FD;border:1.5px solid #D2E5F7;
  color:#5C86BC;font-weight:900;font-size:14px;display:grid;place-items:center;
}
.water-dots{display:flex;gap:3px;flex-wrap:wrap;}
.water-dot{width:11px;height:14px;border-radius:4px;background:#EDF1F5;border:1px solid #E3E9EF;}
.water-dot.on{background:linear-gradient(180deg,#A9D4F5,#7FB8E8);border-color:#8CC0EC;}
.health-memo{
  width:100%;border:1.5px dashed #DDE7DA;border-radius:11px;padding:8px 10px;
  font-size:13px;background:#FFFFFF;outline:none;resize:none;min-height:38px;margin-top:6px;
}
.temp-input{
  width:64px;border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px;outline:none;background:#FFFFFF;
}
.mood-chips{display:flex;gap:5px;flex-wrap:wrap;}
.mood{
  font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;
  border:1.5px solid var(--line);background:#FFFFFF;color:#A2917C;
}
.mood.on{background:#FFF3D6;border-color:#EFD9A5;color:#A98342;}

/* ---------- praise ---------- */
.praise-card{
  background:linear-gradient(150deg,#FFF3F8 0%,#FEF7F0 60%,#FFFCF2 100%);
  border:1.5px solid #F5DFE6;border-radius:var(--radius-lg);
  padding:16px;box-shadow:var(--shadow-soft);margin-bottom:14px;
}
.praise-picks{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap;}
.pick{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:15px;padding:6px 11px 6px 6px;
  border:1.5px solid #F0E4D3;background:#FFFFFF;font-size:13px;font-weight:700;color:#9A8878;
}
.pick svg{width:26px;height:26px;}
.pick.active{background:linear-gradient(180deg,#FFF9E9,#FFF1CE);border-color:#EBD49C;color:#9C7B3E;}
.praise-input{
  width:100%;border:1.5px solid #F0E2CF;border-radius:14px;background:#FFFFFF;
  padding:11px 12px;font-size:14px;outline:none;resize:none;min-height:64px;line-height:1.45;
}
.praise-input:focus{border-color:#E8CDA8;box-shadow:0 0 0 3px rgba(250,235,205,.5);}
.praise-quick{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 11px;}
.praise-quick .chip{font-size:11.5px;cursor:pointer;}
.praise-note{
  display:flex;gap:10px;align-items:flex-start;
  background:#FFFFFF;border:1.5px solid var(--line);border-radius:16px;
  padding:11px;margin-bottom:8px;box-shadow:var(--shadow-soft);
}
.praise-note .avatar{width:38px;height:38px;flex-basis:38px;border-radius:12px;}
.praise-note .avatar svg{width:34px;height:34px;}
.praise-note-body{flex:1 1 auto;min-width:0;}
.praise-note-text{font-size:13.5px;color:#6E5C4C;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;}
.praise-note-meta{font-size:11px;color:var(--ink-faint);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

/* ---------- allowance ---------- */
.allow-card{
  background:linear-gradient(150deg,#FFF4E6 0%,#FEF8EE 45%,#FFFBEE 100%);
  border:1.5px solid #F3E2C9;border-radius:var(--radius-lg);
  padding:16px;box-shadow:var(--shadow-soft);margin-bottom:14px;
}
.allow-hero{
  display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px;
}
.allow-label{font-size:13px;font-weight:700;color:#A98B62;}
.allow-total{
  font-family:var(--font-title);
  font-size:30px;color:#C08A3E;line-height:1.1;letter-spacing:-0.01em;
}
.allow-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.allow-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:#FFFFFF;border:1.5px solid #F2E4CC;border-radius:999px;
  padding:5px 11px;font-size:12px;font-weight:700;color:#9C8362;
}
.allow-pill b{color:#8C6F44;font-weight:800;}
.allow-field label{display:block;font-size:12.5px;font-weight:700;color:#A08A6B;margin-bottom:5px;}
.allow-field input{
  width:100%;border:1.5px solid #F0E1C9;border-radius:13px;background:#FFFFFF;
  padding:11px 12px;font-size:16px;font-weight:700;outline:none;color:#7A6647;
}
.allow-field input:focus{border-color:#E5C89A;box-shadow:0 0 0 3px rgba(248,232,200,.6);}
.divider-dash{height:0;border-top:1.5px dashed #EFDFC6;margin:13px 0;}
.tx-form{display:flex;gap:6px;flex-wrap:wrap;}
.tx-form input[type=number]{flex:1 1 90px;min-width:0;}
.tx-form input{
  border:1.5px solid #F0E1C9;border-radius:12px;background:#FFFFFF;
  padding:9px 10px;font-size:14px;outline:none;
}
.tx-form input.note{flex:2 1 130px;}
.tx-form .btn{flex:0 0 auto;padding:9px 13px;}
.tx-list{margin-top:10px;}
.tx-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1.5px dashed #F4EBD9;
  font-size:13px;
}
.tx-row:last-child{border-bottom:none;}
.tx-what{flex:1 1 auto;min-width:0;color:#6E5C4C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tx-date{font-size:11px;color:var(--ink-faint);flex:0 0 auto;}
.tx-amount{font-weight:800;flex:0 0 auto;}
.tx-amount.in{color:#5B8F6D;}
.tx-amount.out{color:#C08686;}
.tx-amount.study{color:#B08A4A;}
.allow-sum{
  background:#FFFFFF;border:1.5px dashed #EFDFC6;border-radius:16px;
  padding:11px 13px;margin-bottom:11px;
}
.allow-sum-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:3px 0;color:#8A7455;}
.allow-sum-row b{font-size:14px;color:#7A623F;}
.daily-list{display:flex;flex-direction:column;gap:6px;}
.daily-row{
  display:flex;align-items:center;gap:8px;
  background:#FFFFFF;border:1.5px solid #F2E4CC;border-radius:13px;
  padding:9px 11px;font-size:12.5px;color:#8A7455;
}
.daily-row .d{font-weight:800;color:#7A623F;}
.daily-row .n{margin-left:auto;font-weight:800;color:#B08A4A;}

/* ---------- chat ---------- */
.chat-page{display:flex;flex-direction:column;min-height:0;}
#page-chat .chat-card{
  display:flex;flex-direction:column;
  height:calc(100vh - 300px);
  height:calc(100dvh - 300px);
  min-height:440px;max-height:740px;
}
#page-chat .chat-body{flex:1 1 auto;max-height:none;min-height:150px;}
#page-chat .quick-row,#page-chat .sticker-tray,#page-chat .composer{flex:0 0 auto;}
.chat-card{
  background:linear-gradient(170deg,#FFFDF6,#FFFBF1);
  border:1.5px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-soft);overflow:hidden;margin-bottom:12px;
}
.chat-top{padding:13px 13px 11px;background:linear-gradient(180deg,#F4FAFF,#FDFCF7);border-bottom:1.5px solid var(--line-soft);}
.chat-profile-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.chat-profile-row::-webkit-scrollbar{display:none;}
.profile-chip{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:14px;padding:5px 11px 5px 5px;
  border:1.5px solid #EFE6D6;background:#FFFFFF;
  font-size:12.5px;font-weight:700;color:#9A8878;white-space:nowrap;
  position:relative;
}
.profile-chip svg{width:28px;height:28px;}
.profile-chip.active{background:linear-gradient(180deg,#F2FAFF,#EAF5FE);border-color:#B9DCF2;color:#5C86BC;box-shadow:0 2px 8px rgba(150,190,230,.2);}
.profile-chip .lockbadge{position:absolute;top:-4px;right:-3px;font-size:9px;}
.chat-tools{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap;}
.tool-pill{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;
  border:1.5px solid var(--line);background:#FFFFFF;color:#9A8878;
}
.tool-pill.on{background:#FFF3D9;border-color:#EFDCAF;color:#A4823F;}
.chat-lock-note{font-size:11px;color:#A79387;margin-top:7px;line-height:1.45;}
.chat-body{
  padding:12px 11px 6px;
  background:
    radial-gradient(60% 40% at 10% 0%,rgba(255,246,225,.9),rgba(255,255,255,0) 70%),

/* ---- 00-core.js ---- */
/* ============================================================

'use strict';

const LS_KEY = 'family-record-app.v1';
const APP_VERSION = 1;

/* ---------- tiny helpers ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);

const pad2 = n => String(n).padStart(2, '0');

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const keyOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const parseKey = (k) => { const p = String(k).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const KO_DOW = ['일', '월', '화', '수', '목', '금', '토'];
const fmtKoDate = (k) => { const d = parseKey(k); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${KO_DOW[d.getDay()]}요일`; };

const fmtClock = (iso) => {
  const d = new Date(iso);
  let h = d.getHours(); const m = pad2(d.getMinutes());
  const ap = h < 12 ? '오전' : '오후';
  h = h % 12; if (h === 0) h = 12;
  return `${ap} ${h}:${m}`;
};
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);

    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return defaultState();
    return migrate(parsed);
  } catch (err) {
    console.warn('저장된 기록을 불러오지 못했어요.', err);
    return defaultState();
  }
}

function migrate(s) {
  const base = defaultState();
  s.version = s.version || 1;
  s.settings = Object.assign({}, base.settings, s.settings || {});
  s.members = s.members || base.members;
  MEMBER_ORDER.forEach(id => {
    s.members[id] = Object.assign({}, base.members[id], s.members[id] || {});
    s.members[id].id = id;
  });
  ['routines', 'stamps', 'missions', 'meals', 'health', 'allowance', 'study', 'praise', 'chat'].forEach(k => {
    if (!s[k] || typeof s[k] !== 'object') s[k] = base[k];
  });
  s.study.items = Array.isArray(s.study.items) ? s.study.items : base.study.items;
  s.study.done = s.study.done || {};
  s.schedule = Array.isArray(s.schedule) ? s.schedule : base.schedule;
  ['choco', 'hodo'].forEach(id => {
    if (!s.allowance[id]) s.allowance[id] = { start: 0, tx: [] };
    if (!Array.isArray(s.allowance[id].tx)) s.allowance[id].tx = [];
  });
  s.timer = Object.assign({}, base.timer, s.timer || {});
  s.version = APP_VERSION;
  return s;
}

let saveTimer = 0;
/* 동기화 준비 메모
   지금은 state 전체를 localStorage에만 저장합니다.
   나중에 Supabase/Firebase를 붙일 때는 이 save()에서 state를 서버로 push하고,
   load()에서 서버 값을 받아오면 화면 코드는 그대로 쓸 수 있어요.
   (state는 직렬화 가능한 순수 JSON이라 그대로 payload로 쓸 수 있습니다.) */
function save() {
  if (!state) return;
  state.updatedAt = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn('저장 공간이 부족해요.', err);
      toast('저장 공간이 부족해 기록을 저장하지 못했어요 😢');
    }
  }, 60);
}

function commit() { save(); render(); }

/* ---------- daily getters ---------- */
function routineOf(dateKey) {
  const k = dateKey || todayKey();
  if (!state.routines[k]) state.routines[k] = { choco: [], hodo: [], mom: [] };
  const day = state.routines[k];
  MEMBER_ORDER.forEach(id => { if (!Array.isArray(day[id])) day[id] = []; });
  return day;
}
function mealsOf(dateKey) {
  const k = dateKey || todayKey();
  if (!state.meals[k]) state.meals[k] = { breakfast: [], lunch: [], dinner: [], snack: [] };
  return state.meals[k];
}
function healthOf(dateKey) {
  const k = dateKey || todayKey();
  if (!state.health[k]) state.health[k] = {};
  const day = state.health[k];
  MEMBER_ORDER.forEach(id => {
    if (!day[id]) day[id] = { med: false, water: 0, mood: '', temp: '', memo: '' };
    day[id] = Object.assign({ med: false, water: 0, mood: '', temp: '', memo: '' }, day[id]);
  });
  return day;
}
function missionOf(dateKey) {
  const k = dateKey || todayKey();
  if (!state.missions[k]) {
    const m = pickMission();
    state.missions[k] = { text: m.text, emoji: m.emoji, count: 0 };
  }
  return state.missions[k];
}
function studyDoneToday() {
  const t = todayKey();
  if (!state.study.done[t]) state.study.done[t] = {};
  return state.study.done[t];
}
function studyItemsFor(memberId, dateKey) {
  const dk = dateKey || todayKey();
  return state.study.items.filter(it => it.member === memberId && (it.pinned || !it.created || it.created === dk || it.pinnedToday));
}
function allowanceOf(id) {
  if (!state.allowance[id]) state.allowance[id] = { start: 0, tx: [] };
  if (!Array.isArray(state.allowance[id].tx)) state.allowance[id].tx = [];
  return state.allowance[id];
}
function balanceOf(id) {
  const a = allowanceOf(id);
  return a.tx.reduce((sum, t) => sum + (t.type === 'out' ? -t.amount : t.amount), Number(a.start) || 0);
}
function totalsOf(id) {
  const a = allowanceOf(id);
  const t = { start: Number(a.start) || 0, study: 0, in: 0, out: 0 };
  a.tx.forEach(x => { if (x.type === 'study') t.study += x.amount; else if (x.type === 'in') t.in += x.amount; else if (x.type === 'out') t.out += x.amount; });
  return t;
}
function stampSet(memberId) {
  if (!state.stamps[memberId]) state.stamps[memberId] = {};
  return state.stamps[memberId];
}
function stampToday(memberId, manual) {
  if (!state.members[memberId] || state.members[memberId].allowance === undefined) return false;
  const set = stampSet(memberId);
  const t = todayKey();
  if (set[t]) return false;
  set[t] = manual ? 'manual' : 'auto';
  return true;
}
function streakOf(memberId) {
  const set = stampSet(memberId);
  let d = todayKey();
  if (!set[d]) d = addDays(d, -1);
  let n = 0;
  while (set[d] && n < 400) { n++; d = addDays(d, -1); }
  return n;
}
function stampsInMonth(memberId, y, m) {
  const set = stampSet(memberId);
  return Object.keys(set).filter(k => {
    const d = parseKey(k);
    return d.getFullYear() === y && d.getMonth() === m;
  }).length;
}

function addStars(id, n) {
  const m = state.members[id];

  m.stars = Math.max(0, (Number(m.stars) || 0) + n);

function earnStudyAllowance(memberId, item) {
  if (!state.members[memberId] || !state.members[memberId].allowance) return;
  const a = allowanceOf(memberId);
  const t = todayKey();
  if (a.tx.some(x => x.type === 'study' && x.itemId === item.id && x.date === t)) return;
  a.tx.push({ id: uid('tx'), type: 'study', amount: Number(item.reward) || 0, note: item.title, date: t, itemId: item.id });
}

  const a = allowanceOf(memberId);
  const t = todayKey();
  a.tx = a.tx.filter(x => !(x.type === 'study' && x.itemId === item.id && x.date === t));
}

function weatherIcon(code, size) {
  const s = size || 34;
  const c = Number(code);
  const wrap = (inner) => `<svg viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true">${inner}</svg>`;
  const sun = `<circle cx="24" cy="24" r="8.6" fill="#FBC93F"/><g stroke="#F5B921" stroke-width="2.6" stroke-linecap="round"><path d="M24 6.5v4M24 37.5v4M6.5 24h4M37.5 24h4M11.6 11.6l2.8 2.8M33.6 33.6l2.8 2.8M36.4 11.6l-2.8 2.8M14.4 33.6l-2.8 2.8"/></g>`;
  const cloud = (fill) => `<path d="M15 34h17.5a6.5 6.5 0 0 0 .6-13 8.6 8.6 0 0 0-16.4 1.6A5.7 5.7 0 0 0 15 34z" fill="${fill || '#FFF'}" stroke="#B9CBDE" stroke-width="1.6"/>`;
  if (c === 0) return wrap(sun);
  if (c === 1 || c === 2) return wrap(`<circle cx="30" cy="18" r="8" fill="#FBC93F"/><g stroke="#F5B921" stroke-width="2.2" stroke-linecap="round"><path d="M30 5v3M30 28v1M17 18h3M41 18h-1"/></g>${cloud('#FFFFFF')}`);
  if (c === 3) return wrap(cloud('#F2F6FA') + `<path d="M15 34h17.5a6.5 6.5 0 0 0 .6-13 8.6 8.6 0 0 0-16.4 1.6A5.7 5.7 0 0 0 15 34z" fill="none" stroke="#B9CBDE" stroke-width="1.6"/>`);
  if (c >= 45 && c <= 48) return wrap(`<g stroke="#C6D4E2" stroke-width="2.6" stroke-linecap="round"><path d="M10 18h28M8 24h32M10 30h28"/></g>`);
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return wrap(cloud('#F4F8FC') + `<g stroke="#7FB3E0" stroke-width="2.6" stroke-linecap="round"><path d="M17 37l-2 5M25 37l-2 5M33 37l-2 5"/></g>`);
  if (c >= 71 && c <= 77) return wrap(cloud('#F7FAFD') + `<g fill="#9DC9E8"><circle cx="17" cy="39" r="1.8"/><circle cx="25" cy="41" r="1.8"/><circle cx="33" cy="39" r="1.8"/></g>`);
  if (c >= 95) return wrap(cloud('#E9EEF5') + `<path d="M26 34l-6 8h5l-2 6 7-9h-5z" fill="#F5B921" stroke="#E5A414" stroke-width="1"/>`);
  return wrap(sun);
}

/* ---------- toast ---------- */
function toast(msg) {
  const wrap = $('#toastWrap');
  if (!wrap) return;
  while (wrap.childElementCount >= 2) wrap.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s ease, transform .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-6px)';
    setTimeout(() => el.remove(), 320);
  }, 1900);
}

/* ---------- sheets ---------- */
function closeSheet() {
  const root = $('#modalRoot');
  if (root) root.innerHTML = '';
  ui.openSheet = null;
  ui.sheetSubmit = null;
  document.body.style.overflow = '';
}

function openSheet(opts) {
  const o = opts || {};
  const root = $('#modalRoot');
  if (!root) return;
  root.innerHTML = `
    <div class="overlay" data-overlay="1">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title || '')}">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <div class="sheet-title">${o.icon ? `<span>${o.icon}</span>` : ''}${esc(o.title || '')}</div>
          <button class="sheet-close" data-act="sheet.close" aria-label="닫기">✕</button>
        </div>
        <div class="sheet-body">${o.body || ''}</div>
        ${o.actions ? `<div class="sheet-actions">${o.actions}</div>` : ''}
      </div>
    </div>`;
  ui.openSheet = o;
  ui.sheetSubmit = o.onSubmit || null;
  document.body.style.overflow = 'hidden';
  const sheet = $('.sheet', root);
  if (sheet) sheet.scrollTop = 0;
  const first = $('input,textarea,select', root);
  if (first && o.focus !== false) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }, 120);
}

/* generic form sheet
   fields: [{key,label,type,value,placeholder,options,rows,min,max,step,hint,required}] */
function formSheet(opts) {
  const o = opts || {};
  const fields = o.fields || [];
  const body = fields.map(f => {
    const id = 'f_' + f.key;
    if (f.type === 'select') {
      const opts2 = (f.options || []).map(op => {
        const val = typeof op === 'string' ? op : op.value;
        const lab = typeof op === 'string' ? op : op.label;
        return `<option value="${esc(val)}"${String(f.value) === String(val) ? ' selected' : ''}>${esc(lab)}</option>`;
      }).join('');
      return `<div class="field"><label for="${id}">${esc(f.label)}</label><select id="${id}" data-field="${esc(f.key)}">${opts2}</select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div class="field"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" data-field="${esc(f.key)}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
    }
    if (f.type === 'checkbox') {
      return `<div class="opt-row"><div class="grow"><div class="opt-title">${esc(f.label)}</div>${f.hint ? `<div class="opt-sub">${esc(f.hint)}</div>` : ''}</div>
        <button class="switch${f.value ? ' on' : ''}" data-act="sheet.check" data-field="${esc(f.key)}" aria-pressed="${f.value ? 'true' : 'false'}"></button>
        <input type="hidden" data-field="${esc(f.key)}" value="${f.value ? '1' : ''}" /></div>`;
    }
    const extra = f.type === 'number' ? ` inputmode="numeric"` : '';
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>
      <input id="${id}" type="${f.type || 'text'}" data-field="${esc(f.key)}" value="${esc(f.value == null ? '' : f.value)}"
        placeholder="${esc(f.placeholder || '')}"${extra}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''}${f.step != null ? ` step="${f.step}"` : ''} />
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
  }).join('');
  openSheet({
    title: o.title,
    icon: o.icon,
    body: (o.description ? `<div class="card-desc">${esc(o.description)}</div>` : '') + body,
    actions: `<button class="btn" data-act="sheet.close">취소</button><button class="btn btn-primary" data-act="sheet.submit">${esc(o.submitLabel || '저장')}</button>`,
    onSubmit: o.onSubmit,
  });
}

function readSheetValues(root) {
  const out = {};
  $$('[data-field]', root || document).forEach(el => {
    if (el.classList.contains('switch')) return;
    out[el.getAttribute('data-field')] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return out;
}

function submitSheet() {
  if (!ui.sheetSubmit) { closeSheet(); return; }
  const root = $('#modalRoot');
  const values = readSheetValues(root);
  const keep = ui.sheetSubmit(values, root);
  if (keep === false) return;
  closeSheet();
}

function confirmSheet(title, message, okLabel, onOk, danger) {
  openSheet({
    title: title,
    icon: '🐣',
    body: `<div class="card-desc" style="margin-bottom:2px;">${esc(message)}</div>`,
    actions: `<button class="btn" data-act="sheet.close">취소</button>
      <button class="btn ${danger ? 'btn-pink' : 'btn-primary'}" data-act="sheet.confirm">${esc(okLabel || '확인')}</button>`,
    onSubmit: () => { onOk(); },
  });
}

function currentPage() { return state.settings.page || 'home'; }

function showPage(name, opts) {
  if (!PAGES.includes(name)) name = 'home';
  state.settings.page = name;
  save();
  render();

  if (!state) return;

    if (p === 'routine') { el.innerHTML = routineView(); return; }
    if (p === 'meals') { el.innerHTML = mealsView(); return; }
    if (p === 'schedule') { el.innerHTML = scheduleView(); return; }
    if (p === 'health') { el.innerHTML = healthView(); return; }
    if (p === 'praise') { el.innerHTML = praiseView(); return; }

    const el = document.getElementById('page-' + p);

function weatherDesc(code) {

  if (c === 0) return '맑음';

  if (c === 2) return '구름 조금';

function dustGrade(kind, v) {
  if (v == null || isNaN(v)) return null;
  if (kind === 'pm10') {
    if (v <= 30) return '좋음';
    if (v <= 80) return '보통';
    if (v <= 150) return '나쁨';
    return '매우 나쁨';
  }
  if (v <= 15) return '좋음';
  if (v <= 35) return '보통';
  if (v <= 75) return '나쁨';
  return '매우 나쁨';
}

  if (grade === '보통') return 'chip-soft';
  if (grade === '나쁨') return 'chip-peach';
  return 'chip-pink';
}

let weatherBusy = false;
async function refreshWeather(force) {
  const w = state.weather;
  if (!force && w && w.ts && Date.now() - w.ts < 1000 * 60 * 20) return;
  if (weatherBusy) return;
  weatherBusy = true;
  const lat = state.settings.lat;
  const lon = state.settings.lon;
  try {
    const [fRes, aRes] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=1`),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5&timezone=Asia%2FSeoul`),
    ]);
    if (!fRes.ok) throw new Error('weather ' + fRes.status);
    const f = await fRes.json();
    let pm10 = null, pm25 = null;
    try {
      if (aRes && aRes.ok) {
        const a = await aRes.json();
        pm10 = a.current ? a.current.pm10 : null;
        pm25 = a.current ? a.current.pm2_5 : null;
      }
    } catch (e) { /* 대기질은 없어도 괜찮아요 */ }
    state.weather = {
      ok: true,
      city: state.settings.city,
      temp: Math.round(f.current.temperature_2m),
      code: f.current.weather_code,
      tmax: Math.round(f.daily.temperature_2m_max[0]),
      tmin: Math.round(f.daily.temperature_2m_min[0]),
      pm10: pm10 == null ? null : Math.round(pm10),
      pm25: pm25 == null ? null : Math.round(pm25),
      ts: Date.now(),
    };
    save();
  } catch (err) {
    console.warn('날씨를 불러오지 못했어요', err);
    state.weather = { ok: false, city: state.settings.city, ts: Date.now() };
    save();
  } finally {
    weatherBusy = false;
    if (currentPage() === 'home') render();
  }
}

/* ---------- timer ---------- */
function timerBoxView() {
  const tm = state.timer;
  const isCount = tm.mode !== 'stop';
  return `
    <div class="timer-box">
      <div class="timer-tabs">
        <button class="timer-tab${isCount ? ' active' : ''}" data-act="timer.mode" data-mode="count">⏳ 남은 시간</button>
        <button class="timer-tab${!isCount ? ' active' : ''}" data-act="timer.mode" data-mode="stop">⏱️ 재는 시간</button>
      </div>
      <div class="timer-caption">${isCount ? `${tm.minutes}분 · 시작을 눌러요` : '공부한 시간을 재어 볼까요?'}</div>
      <div class="timer-display${isCount ? '' : ' small'}" id="timerDisplay">${timerText()}</div>
      <div class="timer-controls">
        <button class="btn btn-primary" data-act="${tm.running ? 'timer.pause' : 'timer.start'}">${tm.running ? '⏸ 일시정지' : '▶ 시작'}</button>
        <button class="btn" data-act="timer.reset">↺ 초기화</button>
      </div>
      ${isCount ? `
      <div class="timer-presets">
        ${[10, 20, 30].map(n => `<button class="preset${tm.minutes === n ? ' active' : ''}" data-act="timer.preset" data-min="${n}">${n}분</button>`).join('')}
      </div>
      <div class="custom-row">
        <input id="customMin" type="number" inputmode="numeric" min="1" max="180" placeholder="직접 분 맞추기" aria-label="분 직접 입력" />
        <button class="btn" data-act="timer.custom">분 맞추기</button>
      </div>` : ''}
      <div class="timer-status" id="timerStatus">${tm.running ? '공부 중이에요 ✏️' : '멈춰 있어요'}</div>
    </div>`;
}

function timerText() {
  const tm = state.timer;
  const sec = tm.mode === 'stop'
    ? Math.max(0, Math.floor(liveElapsed() / 1000))
    : Math.max(0, Math.ceil(liveRemaining() / 1000));
  if (tm.mode === 'stop' && sec >= 3600) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return `${h}:${pad2(m)}:${pad2(s)}`;
  }
  return `${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}`;
}

function liveRemaining() {
  const tm = state.timer;
  if (tm.running && tm.endsAt) return Math.max(0, tm.endsAt - Date.now());
  return Math.max(0, tm.remaining * 1000);
}
function liveElapsed() {
  const tm = state.timer;
  if (tm.running && tm.startedAt) return Math.max(0, Date.now() - tm.startedAt);
  return Math.max(0, tm.elapsed || 0);
}

let tickTimer = 0;
function startTicker() {
  if (tickTimer) return;
  tickTimer = setInterval(tick, 500);
}
function tick() {
  const tm = state.timer;
  if (!tm.running) {
    const el = document.getElementById('timerDisplay');
    if (el) el.textContent = timerText();
    return;
  }
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = timerText();
  if (tm.mode !== 'stop' && liveRemaining() <= 0) {
    tm.running = false;
    tm.remaining = 0;
    tm.endsAt = 0;
    save();
    const st = document.getElementById('timerStatus');
    if (st) st.textContent = '다 됐어요! 잘했어요 🎉';
    beep(660, 0.14); setTimeout(() => beep(880, 0.18), 180);
    toast('공부 시간 끝! 정말 잘했어요 🎉');
  }
}

function timerStart() {
  const tm = state.timer;
  if (tm.mode === 'stop') {
    tm.startedAt = Date.now() - (tm.elapsed || 0);
  } else {
    if (!tm.remaining || tm.remaining <= 0) tm.remaining = tm.minutes * 60;
    tm.endsAt = Date.now() + tm.remaining * 1000;
  }
  tm.running = true;
  save();
  startTicker();
  render();
}
function timerPause() {
  const tm = state.timer;
  if (tm.mode === 'stop') tm.elapsed = liveElapsed();
  else tm.remaining = Math.max(0, Math.ceil(liveRemaining() / 1000));
  tm.running = false;
  tm.endsAt = 0;
  tm.startedAt = 0;
  save();
  render();
}
function timerReset() {
  const tm = state.timer;
  tm.running = false;
  tm.endsAt = 0;
  tm.startedAt = 0;
  tm.elapsed = 0;
  tm.remaining = (tm.minutes || 10) * 60;
  save();
  render();
}
function setTimerMinutes(n) {
  const tm = state.timer;
  tm.minutes = clamp(Math.round(n) || 10, 1, 180);
  tm.mode = 'count';
  tm.running = false;
  tm.remaining = tm.minutes * 60;
  tm.endsAt = 0;
  save();
  render();
}

/* ---------- schedule ---------- */
const MEMBER_COLOR = { choco: 'chip-peach', hodo: 'chip-mint', mom: 'chip-pink' };

function scheduleView() {
  if (!ui.calCursor) ui.calCursor = new Date();
  const y = ui.calCursor.getFullYear();
  const mo = ui.calCursor.getMonth();
  const first = new Date(y, mo, 1);
  const startDow = (first.getDay() + 6) % 7;
  const days = new Date(y, mo + 1, 0).getDate();
  const t = todayKey();
  const byDate = {};
  state.schedule.forEach(ev => { (byDate[ev.date] = byDate[ev.date] || []).push(ev); });

  let cells = ['월', '화', '수', '목', '금', '토', '일']
    .map((d, i) => `<div class="cal-dow${i === 5 ? ' sun' : (i === 6 ? ' sun' : '')}">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell other"></div>';
  for (let d = 1; d <= days; d++) {
    const k = keyOf(new Date(y, mo, d));
    const has = !!byDate[k];
    cells += `<div class="cal-cell${k === t ? ' today' : ''}${has ? ' has-event' : ''}" ${has ? `title="${esc(byDate[k].map(e => e.title).join(', '))}"` : ''}>
      <span>${d}</span>${has ? '<span class="cal-dot"></span>' : ''}
    </div>`;
  }

  const upcoming = state.schedule
    .filter(ev => ev.date >= t)
    .sort((a, b) => a.date.localeCompare(b.date));
  const past = state.schedule.filter(ev => ev.date < t).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 2);
  const rows = upcoming.length
    ? upcoming.map(eventRow).join('')
    : `<div class="empty-note">다가오는 일정이 없어요. 아래에서 추가해 보세요 🌷</div>`;

  return `
    <div class="page-head">
      <h2>📅 가족 일정</h2>
      <p>소풍, 병원, 할머니 댁 방문까지 한눈에 모아 봐요</p>
    </div>
    <div class="card cal-card">
      <div class="cal-head">
        <div class="cal-month">${y}년 ${mo + 1}월</div>
        <div class="cal-nav">
          <button class="mini-btn" data-act="cal.prev" aria-label="이전 달">‹</button>
          <button class="mini-btn" data-act="cal.next" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title">🌷 다가오는 일정</div>
        <button class="btn btn-sm" data-act="event.add">+ 일정 추가</button>
      </div>
      ${rows}
      ${past.length ? `<div class="hr-dash"></div><div class="card-desc" style="margin-bottom:4px;">지난 일정</div>${past.map(eventRow).join('')}` : ''}
    </div>`;
}

  const d = parseKey(ev.date);

  return `
    <div class="event-row">

/* ============================================================

'use strict';

const CHAT_QUICK = ['다녀올게요!', '밥 먹자 🍚', '사랑해 ❤️', '잘 자 🌙', '오늘 고마워', '이따 봐요'];

function chatDayLabel(iso) {
  const d = new Date(iso);
  const k = keyOf(d);
  const t = todayKey();
  if (k === t) return '오늘';
  if (k === addDays(t, -1)) return '어제';
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${KO_DOW[d.getDay()]})`;
}

function renderChat(el) {
  const me = state.settings.chatProfile || 'mom';
  const locked = !!state.settings.deviceLock;
  const msgs = state.chat.slice().sort((a, b) => (a.at || '').localeCompare(b.at || ''));
  let lastDay = '';
  const body = msgs.map(msg => {
    if (msg.deleted) return '';
    const d = new Date(msg.at || Date.now());
    const dayKey = keyOf(d);
    let daySep = '';
    if (dayKey !== lastDay) {
      daySep = `<div class="chat-day"><span>${chatDayLabel(msg.at)}</span></div>`;
      lastDay = dayKey;
    }
    const mine = msg.by === me;
    const who = state.members[msg.by];
    let inner = '';
    if (msg.type === 'sticker') {
      inner = `<div class="bubble sticker">${stickerSVG(msg.sticker)}</div>`;
    } else if (msg.type === 'voice') {
      inner = `<div class="bubble voice" data-act="chat.playVoice" data-id="${msg.id}" role="button" aria-label="음성 메시지 재생">
        <span class="voice-play">▶</span>
        <span class="voice-wave">${Array.from({ length: 18 }, (_, i) => `<i style="height:${6 + ((i * 7) % 14)}px"></i>`).join('')}</span>
        <span class="voice-dur">0:${pad2(msg.sec || 5)}</span>
      </div>`;
    } else {
      inner = `<div class="bubble">${esc(msg.text)}</div>`;
    }
    const reaction = msg.reaction ? `<span class="chip" style="padding:1px 7px;font-size:11px;background:#FFF3F6;border-color:#F7DCE5;">${msg.reaction}</span>` : '';
    return `${daySep}
      <div class="msg${mine ? ' mine' : ''}">
        ${mine ? '' : avatarHTML(msg.by, 'xs')}
        <div class="msg-col">
          ${mine ? '' : `<div class="msg-who">${esc(who ? who.name : msg.by)} <span class="msg-time">${fmtClock(msg.at)}</span></div>`}
          ${inner}
          <div class="msg-actions">
            ${reaction}
            <button class="act-btn react${msg.reaction ? ' reacted' : ''}" data-act="chat.react" data-id="${msg.id}" aria-label="하트 반응" aria-pressed="${msg.reaction ? 'true' : 'false'}">${ICONS.heart}</button>
            <button class="act-btn" data-act="chat.del" data-id="${msg.id}" aria-label="삭제">✕</button>
            ${mine ? `<span class="msg-time">${fmtClock(msg.at)}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="page-head">
      <h2>💬 우리 가족 채팅</h2>
      <p>${esc(memberList().map(m => m.name).join('·'))}가 말풍선과 스티커로 이야기해요</p>
    </div>
    <div class="chat-card">
      <div class="chat-top">
        <div class="chat-profile-row">
          ${MEMBER_ORDER.map(id => {
            const m = state.members[id];
            const active = id === me;
            return `<button class="profile-chip${active ? ' active' : ''}" data-act="chat.profile" data-member="${id}">
              ${charSVG(id)}<span>${esc(m.name)}</span>${active && locked ? '<span class="lockbadge">🔒</span>' : ''}
            </button>`;
          }).join('')}
        </div>
        <div class="chat-tools">
          <button class="tool-pill${locked ? ' on' : ''}" data-act="chat.lock">${locked ? '🔒 이 기기 잠금' : '🔓 잠금 풀림'}</button>
          <button class="tool-pill${state.settings.soundOn ? ' on' : ''}" data-act="chat.sound">${state.settings.soundOn ? '🔔 알림음 켜짐' : '🔕 알림음 꺼짐'}</button>
        </div>
        <div class="chat-lock-note">한 번 고르면 이 기기에 기억돼요 · 다음에 또 바꿀 필요 없어요</div>
      </div>
      <div class="chat-body" id="chatBody">
        ${body || emptyNote('첫 인사를 남겨 보세요 💌')}
      </div>
      <div class="quick-row">
        ${CHAT_QUICK.map(q => `<button class="quick" data-act="chat.quick" data-text="${esc(q)}">${esc(q)}</button>`).join('')}
      </div>
      ${ui.stickerTray ? `<div class="sticker-tray">
        ${STICKERS.map(s => `<button class="sticker-btn" data-act="chat.sticker" data-sticker="${s.id}" aria-label="${esc(s.label)} 스티커">${stickerSVG(s.id)}</button>`).join('')}
      </div>` : ''}
      <div class="composer">
        <button class="round-btn" data-act="chat.voice" aria-label="음성 메시지" title="음성 메시지">${ICONS.mic}</button>
        <button class="round-btn" data-act="chat.tray" aria-label="스티커" title="스티커" style="${ui.stickerTray ? 'background:#FFF3D9;border-color:#EFDCAF;' : ''}">🙂</button>
        <input type="text" id="chatInput" placeholder="${esc(mname(me))}로 보내기" aria-label="메시지 입력" />
        <button class="round-btn send" data-act="chat.send" aria-label="보내기">${ICONS.send}</button>
      </div>
    </div>`;
  const input = $('#chatInput');
  if (input && ui.chatDraft) input.value = ui.chatDraft;
  restoreChatScroll();
}

function restoreChatScroll() {
  const box = document.getElementById('chatBody');
  if (!box) return;
  if (ui.chatScroll != null && ui.chatScroll > 0) box.scrollTop = ui.chatScroll;
  else box.scrollTop = box.scrollHeight;
}

function sendChatMessage(payload) {
  const me = state.settings.chatProfile || 'mom';
  const msg = Object.assign({ id: uid('ch'), by: me, at: new Date().toISOString() }, payload);
  state.chat.push(msg);
  save();
  ui.chatScroll = null;
  render();
  scrollChatToBottom();
  const input = $('#chatInput');
  if (input) input.focus({ preventScroll: true });
}

function scrollChatToBottom() {
  const box = document.getElementById('chatBody');
  if (box) box.scrollTop = box.scrollHeight;
}

let audioCtx = null;
function beep(freq, dur) {
  if (!state.settings.soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq || 720;
    g.gain.value = 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
    o.stop(audioCtx.currentTime + (dur || 0.12) + 0.02);
  } catch (e) { /* 소리가 안 나도 괜찮아요 */ }
}

function playVoice(id) {
  const box = document.getElementById('chatBody');
  if (!box) return;
  const el = box.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  const bars = $$('.voice-wave i', el);
  bars.forEach(b => b.classList.remove('on'));
  const msg = state.chat.find(m => m.id === id);
  const sec = msg ? msg.sec || 5 : 5;
  beep(520, 0.1);
  let i = 0;
  const step = Math.max(40, (sec * 1000) / Math.max(1, bars.length));
  const t = setInterval(() => {
    if (i >= bars.length) { clearInterval(t); return; }
    bars[i].classList.add('on');
    i++;
  }, step);
}

/* ---------- export / import / reset ---------- */
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `우리가족기록장-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('기록 파일을 내려받았어요 ⬇️');
  } catch (err) {
    toast('내보내지 못했어요 😢');
  }
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (!parsed || !parsed.members || !parsed.settings) throw new Error('형식이 달라요');
      confirmSheet('기록 불러오기', '지금 이 기기에 있는 기록을 불러온 파일로 바꿀까요? 지금 기록은 사라져요.', '불러올게요', () => {
        state = migrate(parsed);
        save();
        render();
        toast('기록을 불러왔어요 ⬆️');
      });
    } catch (err) {
      toast('우리 가족 기록장 파일이 아니에요 😢');
    }
  };
  reader.readAsText(file);
}

function resetData() {
  confirmSheet('기록 초기화', '이 기기의 모든 기록이 사라지고 처음 샘플로 돌아가요. 계속할까요?', '초기화', () => {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    state = defaultState();
    save();
    render();
    toast('처음 상태로 돌아왔어요');
  }, true);
}
