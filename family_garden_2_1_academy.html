<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가족 기록장 · 태블릿 가로형</title>
<meta name="theme-color" content="#FFF8EE">
<meta name="description" content="초코하임과 호도리의 포근한 가족 기록장 — 태블릿 가로 화면에 맞춘 버전">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   우리 가족 기록장 · 태블릿 가로형
   치이카와 감성 파스텔 테마
   ========================================================================== */

:root {
  --cream: #fff8ee;
  --cream-2: #fdf1e1;
  --cream-3: #fbe7d0;
  --paper: #fffdf9;
  --ink: #5b4636;
  --ink-2: #8a7563;
  --ink-3: #b3a090;
  --line: #efe0cd;
  --line-2: #f6ecdd;

  --pink: #f7a8b8;
  --pink-2: #e98aa0;
  --pink-soft: #fde5e9;
  --peach: #ffd8b8;
  --peach-soft: #fff0e2;
  --mint: #bfe3d0;
  --mint-2: #7fc2a4;
  --mint-soft: #e8f6ee;
  --sky: #cde4f5;
  --sky-2: #8fbfe0;
  --sky-soft: #e9f4fd;
  --butter: #ffe9a8;
  --butter-soft: #fff8dd;
  --lilac: #d9cdf5;
  --lilac-soft: #f0ebfd;

  --shadow-s: 0 2px 6px rgba(176, 143, 110, .08);
  --shadow: 0 8px 22px rgba(176, 143, 110, .13);
  --shadow-l: 0 14px 34px rgba(176, 143, 110, .16);

  --r-s: 14px;
  --r-m: 20px;
  --r-l: 26px;
  --r-xl: 32px;

  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", "Apple Color Emoji", "Noto Color Emoji", system-ui, sans-serif;
  --font-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Apple Color Emoji", "Noto Color Emoji", system-ui, sans-serif;

  --side-w: 268px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--cream);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* 은은한 배경 (파스텔 방울들) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(520px 380px at 88% -6%, rgba(255, 226, 205, .85), transparent 70%),
    radial-gradient(480px 340px at 4% 102%, rgba(226, 243, 233, .8), transparent 72%),
    radial-gradient(420px 320px at 62% 108%, rgba(253, 231, 236, .75), transparent 70%),
    radial-gradient(360px 280px at 22% -4%, rgba(233, 244, 253, .7), transparent 70%),
    var(--cream);
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 3px solid rgba(233, 138, 160, .55); outline-offset: 2px; border-radius: 10px; }

/* ==========================================================================
   App shell
   ========================================================================== */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
  min-height: 0;
}

/* ---------- 사이드바 ---------- */
.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 22px 16px 16px;
  background: linear-gradient(175deg, #fffaf2 0%, #fdefdf 62%, #fde9dd 100%);
  border-right: 1px solid var(--line);
  box-shadow: 4px 0 18px rgba(190, 160, 130, .07);
}

.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 2px; }
.brand-mark { width: 44px; height: 44px; flex: 0 0 44px; }
.brand-text { min-width: 0; }
.brand-title {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: -.4px;
  color: var(--pink-2);
  line-height: 1.15;
  white-space: nowrap;
}
.brand-sub { font-size: 11.5px; color: var(--ink-3); letter-spacing: -.1px; }

.side-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 20px 8px 8px;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.side-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* 구성원 전환 */
.members { display: flex; flex-direction: column; gap: 8px; }
.member-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  min-height: 56px;
  border-radius: 18px;
  border: 1.5px solid transparent;
  background: rgba(255, 255, 255, .5);
  text-align: left;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease;
}
.member-btn:hover { background: #fffdf9; transform: translateY(-1px); box-shadow: var(--shadow-s); }
.member-btn .m-avatar {
  width: 40px; height: 40px; flex: 0 0 40px;
  border-radius: 50%;
  background: #fff;
  display: grid; place-items: center;
  overflow: hidden;
  border: 1.5px solid var(--line);
}
.member-btn .m-avatar svg { width: 100%; height: 100%; display: block; }
.member-btn .m-body { min-width: 0; flex: 1; }
.member-btn .m-name { font-family: var(--font-display); font-size: 15.5px; line-height: 1.2; color: var(--ink); }
.member-btn .m-meta { font-size: 11px; color: var(--ink-3); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-btn .m-star { font-size: 11.5px; color: #c99b2f; white-space: nowrap; }
.member-btn.is-active {
  background: linear-gradient(120deg, #fff6ee, #ffe9ef);
  border-color: var(--pink);
  box-shadow: 0 6px 16px rgba(240, 170, 185, .28);
}
.member-btn.is-active .m-avatar { border-color: var(--pink); box-shadow: 0 0 0 3px #fff inset; }
.member-btn.is-active .m-name { color: var(--pink-2); }

/* 메뉴 */
.nav { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 46px;
  padding: 8px 12px;
  border-radius: 15px;
  color: var(--ink-2);
  font-size: 14.5px;
  letter-spacing: -.2px;
  transition: background .15s ease, color .15s ease, transform .15s ease;
  text-align: left;
}
.nav-item:hover { background: rgba(255, 255, 255, .72); color: var(--ink); }
.nav-item .nav-ico { width: 22px; height: 22px; flex: 0 0 22px; opacity: .9; }
.nav-item .nav-txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .nav-badge {
  min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 999px;
  background: var(--peach-soft);
  color: #b07c4f;
  font-size: 11px;
  display: grid; place-items: center;
  border: 1px solid #f6ddc4;
}
.nav-item.is-active {
  background: #fffdf9;
  color: var(--pink-2);
  font-weight: 700;
  box-shadow: var(--shadow-s);
}
.nav-item.is-active .nav-ico { opacity: 1; }
.nav-item.is-active .nav-badge { background: var(--pink-soft); color: var(--pink-2); border-color: #f8cfd8; }

.side-foot { margin-top: auto; padding-top: 12px; }
.save-note {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--ink-3);
  margin: 0 4px 8px;
}
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint-2); box-shadow: 0 0 0 3px rgba(127, 194, 164, .18); }
.save-dot.is-busy { background: var(--butter); box-shadow: 0 0 0 3px rgba(255, 233, 168, .3); }
.backup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mini-btn {
  min-height: 36px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fffdf9;
  color: var(--ink-2);
  font-size: 12px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: background .15s ease, transform .15s ease;
}
.mini-btn:hover { background: #fff; transform: translateY(-1px); box-shadow: var(--shadow-s); }
.mini-btn svg { width: 14px; height: 14px; }

/* ---------- 본문 ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.main-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 22px 18px;
  scrollbar-width: thin;
  scrollbar-color: #e9d8c2 transparent;
}
.main-scroll::-webkit-scrollbar { width: 9px; }
.main-scroll::-webkit-scrollbar-thumb { background: #eddfcd; border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }

.topbar { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.topbar .tb-text { min-width: 0; flex: 1; }
.tb-title {
  font-family: var(--font-display);
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: -.6px;
  color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.tb-title .tb-emoji { font-size: 22px; }
.tb-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.tb-right { display: flex; align-items: center; gap: 8px; }
.date-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  background: #fffdf9;
  border: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--ink-2);
  box-shadow: var(--shadow-s);
  white-space: nowrap;
}
.date-chip b { color: var(--ink); font-weight: 700; }
.mobile-members { display: none; }

/* ==========================================================================
   공용 조각
   ========================================================================== */
.card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  min-width: 0;
}
.card.tint-peach { background: linear-gradient(160deg, #fffaf4, #fff1e5); }
.card.tint-pink { background: linear-gradient(160deg, #fffaf6, #fdeef1); }
.card.tint-mint { background: linear-gradient(160deg, #fbfdfa, #edf8f1); }
.card.tint-sky { background: linear-gradient(160deg, #fbfdff, #eef6fd); }
.card.tint-butter { background: linear-gradient(160deg, #fffdf5, #fff6dd); }
.card.tint-lilac { background: linear-gradient(160deg, #fdfbff, #f3effc); }

.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; min-width: 0; }
.card-head .ch-title {
  font-family: var(--font-display);
  font-size: 16.5px;
  letter-spacing: -.3px;
  color: var(--ink);
  display: flex; align-items: center; gap: 7px;
  min-width: 0;
}
.card-head .ch-title .ch-emoji { font-size: 17px; }
.card-head .ch-note { font-size: 11.5px; color: var(--ink-3); margin-left: auto; white-space: nowrap; }
.card-sub { font-size: 12.5px; color: var(--ink-2); margin: -6px 0 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: #fffdf9;
  color: var(--ink);
  font-size: 14px;
  transition: transform .14s ease, box-shadow .14s ease, background .14s ease, border-color .14s ease;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-s); }
.btn:active { transform: translateY(0) scale(.985); }
.btn-primary { background: linear-gradient(135deg, #f79db0, #e77f95); border-color: #e8879c; color: #fff; box-shadow: 0 6px 14px rgba(232, 135, 156, .3); text-shadow: 0 1px 0 rgba(184, 96, 116, .18); }
.btn-primary:hover { background: linear-gradient(135deg, #f695a9, #e0768c); }
.btn-mint { background: linear-gradient(135deg, #cdeedd, #b3e2cc); border-color: #a9dcc4; color: #2f6b53; box-shadow: 0 6px 14px rgba(140, 200, 172, .3); }
.btn-soft { background: var(--peach-soft); border-color: #f8e2cc; color: #a9743f; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: #fff; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 12.5px; border-radius: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-icon { width: 44px; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
.mini-btn svg, .icon-btn svg { display: block; }
.compose-stk svg { width: 26px; height: 26px; display: block; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 34px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fffdf9;
  font-size: 12.5px;
  color: var(--ink-2);
  transition: background .14s ease, color .14s ease, border-color .14s ease, transform .14s ease;
  white-space: nowrap;
}
.chip:hover { transform: translateY(-1px); background: #fff; }
.chip.is-on { background: var(--pink-soft); border-color: var(--pink); color: var(--pink-2); font-weight: 700; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.tag-pink { background: var(--pink-soft); color: #c96e85; border-color: #f9d3dc; }
.tag-mint { background: var(--mint-soft); color: #4c8b70; border-color: #cfead9; }
.tag-sky { background: var(--sky-soft); color: #5b8cb0; border-color: #d3e7f7; }
.tag-butter { background: var(--butter-soft); color: #a3832b; border-color: #f8e7b4; }
.tag-lilac { background: var(--lilac-soft); color: #7c69b3; border-color: #e2d9f7; }
.tag-peach { background: var(--peach-soft); color: #b07c4f; border-color: #f8e0c9; }

.progress { height: 8px; border-radius: 99px; background: #f3e7d7; overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffc9b3, #f8a7b8); transition: width .35s ease; }
.progress.mint > span { background: linear-gradient(90deg, #bfe7d3, #86c8aa); }
.progress.sky > span { background: linear-gradient(90deg, #cfe6f8, #93c4e4); }

.field {
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
  font-size: 14px;
  color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.field::placeholder { color: var(--ink-3); }
.field:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px rgba(247, 168, 184, .16); }
select.field { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='%238a7563' stroke-width='2.2' stroke-linecap='round'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }

.inline { display: flex; gap: 8px; align-items: center; }
.inline > .field { min-width: 0; }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 22px 12px;
  color: var(--ink-3);
  font-size: 12.5px;
  text-align: center;
}
.empty .empty-face { font-size: 26px; opacity: .8; }

/* 토스트 */
.toast-wrap {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  z-index: 90;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
  width: min(92vw, 420px);
}
.toast {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 18px;
  border-radius: 999px;
  background: rgba(83, 64, 49, .93);
  color: #fff8ee;
  font-size: 13px;
  box-shadow: 0 10px 26px rgba(90, 66, 48, .3);
  animation: toastIn .28s cubic-bezier(.2, .9, .3, 1.3);
  max-width: 100%;
}
.toast.is-out { animation: toastOut .25s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.97); } }

/* 모달 */
.modal-back {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(84, 63, 47, .34);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: 20px;
  animation: fadeIn .18s ease;
}
.modal {
  width: min(460px, 100%);
  background: var(--paper);
  border-radius: var(--r-xl);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-l);
  padding: 22px;
  animation: popIn .22s cubic-bezier(.2, .9, .3, 1.25);
}
.modal h3 { font-family: var(--font-display); font-size: 19px; margin: 0 0 8px; color: var(--ink); }
.modal p { margin: 0 0 16px; font-size: 13px; color: var(--ink-2); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(8px); } }

/* 스크롤 영역 */
.scroll-y { overflow-y: auto; overflow-x: hidden; min-height: 0; scrollbar-width: thin; scrollbar-color: #eddfcd transparent; }
.scroll-y::-webkit-scrollbar { width: 8px; }
.scroll-y::-webkit-scrollbar-thumb { background: #eddfcd; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }

/* ==========================================================================
   홈
   ========================================================================== */
.home-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-content: start; }
.home-grid > .card { grid-column: span 12; }
.h-weather { grid-column: span 4 !important; }
.h-schedule { grid-column: span 4 !important; }
.h-mission { grid-column: span 4 !important; }
.h-summary { grid-column: span 12 !important; }
.h-member { grid-column: span 6 !important; }

/* 다음 일정 · 학원 준비 */
.member-choco { --ev: #e98aa0; --ev-soft: #fdeef2; }
.member-hodori { --ev: #6fa8cf; --ev-soft: #eaf4fc; }
.member-all { --ev: #6fae8e; --ev-soft: #eaf6ef; }
.next-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--ev-soft);
  border: 1px solid var(--line-2);
  border-left: 4px solid var(--ev);
}
.next-item.is-hot { box-shadow: 0 0 0 2px rgba(247, 168, 184, .25); }
.ni-time { display: flex; flex-direction: column; align-items: center; min-width: 42px; }
.ni-time b { font-family: var(--font-display); font-size: 16px; line-height: 1.2; }
.ni-time span { font-size: 10px; color: var(--ink-3); }
.ni-body { flex: 1; min-width: 0; }
.ni-title { font-size: 13.5px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.ni-sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.ni-prep { font-size: 11px; color: #a9743f; margin-top: 3px; }
.ni-when { font-size: 11px; font-weight: 700; color: var(--pink-2); white-space: nowrap; align-self: flex-start; }
.next-rest { display: flex; flex-direction: column; gap: 3px; margin-top: 7px; }
.nr-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); padding: 4px 7px; border-radius: 10px; background: #fffdf9; border: 1px solid var(--line-2); border-left: 3px solid var(--ev); }
.nr-time { font-family: var(--font-display); }
.nr-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.nr-when { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.ni-foot { margin-top: 7px; display: flex; justify-content: flex-end; }

/* 날씨 */
.weather-top { display: flex; align-items: center; gap: 12px; }
.weather-ico { width: 52px; height: 52px; flex: 0 0 52px; }
.weather-main { min-width: 0; }
.weather-city { font-size: 12px; color: var(--ink-3); }
.weather-temp { font-family: var(--font-display); font-size: 32px; line-height: 1.05; color: var(--ink); letter-spacing: -1px; }
.weather-temp small { font-size: 15px; font-family: var(--font-body); color: var(--ink-2); margin-left: 4px; }
.weather-desc { font-size: 12px; color: var(--ink-2); }
.weather-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }

}

/* 구성원 카드 */

}

.todo-list { display: flex; flex-direction: column; gap: 6px; }

}

.routine-groups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.routine-group { background: #fffdf9; border: 1px solid var(--line-2); border-radius: 16px; padding: 7px 8px 9px; min-width: 0; }

.routine-row .check { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 8px; }

.routine-txt { flex: 1; min-width: 0; font-size: 12.8px; line-height: 1.3; overflow-wrap: anywhere; }

/* 타이머 */
.timer-card { text-align: center; }

  margin: 6px 0 2px;

  border: 1.5px dashed #f0dcc4;
}

  font-family: var(--font-display);

}

.timer-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--ink-2); }

.session-list { display: flex; flex-direction: column; gap: 5px; max-height: 168px; overflow-y: auto; }

.session-row .s-time { margin-left: auto; color: var(--ink-3); font-size: 11px; }

/* ==========================================================================
   도장판 & 칭찬
   ========================================================================== */
.stamp-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.stamp-grid > .card { grid-column: span 12; }
.s-board { grid-column: span 4 !important; }
.s-send { grid-column: span 4 !important; }
.s-wall { grid-column: span 12 !important; }
.s-board-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.s-board-head .sb-face { width: 40px; height: 40px; flex: 0 0 40px; }
.s-board-head .sb-name { font-family: var(--font-display); font-size: 15.5px; line-height: 1.2; }
.s-board-head .sb-count { margin-left: auto; font-size: 11.5px; color: var(--ink-2); }
.stamp-board {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}
.stamp-slot {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  border: 1.5px dashed #ecd9c2;
  background: #fffdf9;
  display: grid; place-items: center;
  transition: transform .14s ease, border-color .14s ease, background .14s ease;
  padding: 0;
}
.stamp-slot:hover { border-color: var(--pink); transform: scale(1.05); background: #fff; }
.stamp-slot .slot-num { font-size: 10.5px; color: #d9c7b3; }
.stamp-slot.is-stamped { border: 1.5px solid #f6c9d3; background: radial-gradient(circle at 40% 30%, #fff, #fde9ee); }
.stamp-slot.is-stamped svg { width: 84%; height: 84%; }
.stamp-slot.is-fresh { animation: stampPop .42s cubic-bezier(.2, .9, .3, 1.5); }
@keyframes stampPop { 0% { transform: scale(1.7) rotate(-12deg); opacity: 0; } 60% { transform: scale(.94) rotate(3deg); opacity: 1; } 100% { transform: scale(1); } }
.s-board-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--ink-2); }
.s-board-foot .btn { margin-left: auto; }

.send-form { display: flex; flex-direction: column; gap: 8px; }
.send-to { display: flex; gap: 6px; }
.send-to button {
  flex: 1; min-height: 44px; border-radius: 14px;

}
.send-to button.is-on { border-color: var(--pink); background: var(--pink-soft); color: var(--pink-2); font-weight: 700; }
.send-to button svg { width: 22px; height: 22px; }
.sticker-picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.sticker-pick {
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  border: 1.5px solid var(--line-2);
  background: #fffdf9;
  display: grid; place-items: center;
  padding: 3px;
  transition: transform .14s ease, border-color .14s ease, background .14s ease;
}
.sticker-pick:hover { transform: translateY(-2px); background: #fff; }
.sticker-pick svg { width: 100%; height: 100%; }
.sticker-pick.is-on { border-color: var(--pink); background: var(--pink-soft); box-shadow: 0 0 0 3px rgba(247, 168, 184, .16); }

.praise-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; min-height: 210px; max-height: 230px; overflow-y: auto; align-content: start; }
.praise-card {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px;
  border-radius: 16px;
  background: linear-gradient(150deg, #fffdf9, #fff4ea);
  border: 1px solid var(--line-2);

}
.praise-card .pc-sticker { width: 38px; height: 38px; flex: 0 0 38px; }
.praise-card .pc-body { min-width: 0; }

.praise-card .pc-text { font-size: 12.5px; color: var(--ink); margin-top: 2px; overflow-wrap: anywhere; }

.money-grid > .card { grid-column: span 12; }
.m-balance { grid-column: span 4 !important; }
.m-rules { grid-column: span 4 !important; }

.balance-card { display: flex; flex-direction: column; gap: 10px; }

.rule-list { display: flex; flex-direction: column; gap: 6px; }
.rule-row { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 13px; background: #fffdf9; border: 1px solid var(--line-2); font-size: 12.5px; }

.entry-form { display: flex; flex-direction: column; gap: 8px; }

.ledger-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

.ledger-list { display: flex; flex-direction: column; gap: 5px; max-height: 300px; overflow-y: auto; }
.ledger-row {

/* ==========================================================================

.chat-guide {
  margin: 10px 18px 0;
  padding: 9px 13px;
  border-radius: 14px;
  background: linear-gradient(120deg, #fff8ec, #fdeef2);

.msg { display: flex; gap: 8px; max-width: 84%; align-items: flex-end; }

.sticker-drawer {

    if (!Array.isArray(s.routines) || !s.routines.length) s.routines = base.routines;
    baseRoutines().forEach(function(r) { if (!s.routines.some(function(x) {return x.id === r.id;})) s.routines.push(r); });

  function timerParts() {

      return { text: pad2(Math.floor(ls / 60)) + ':' + pad2(ls % 60), left: left, elapsed: ms };

      (pm != null && pm > 35 ? '바깥 놀이는 잠깐 쉬고, 마스크를 챙겨요.' :
        (w.temp >= 28 ? '물을 자주 마시고 시원하게 지내요.' :

  var calView = null;

  var DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];

  function parseDateKey(dk) {
    var p = String(dk || '').split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function byStart(a, b) { return (a.start || '') < (b.start || '') ? -1 : (a.start || '') > (b.start || '') ? 1 : 0; }
  function repeatLabel(repeat) {
    return DAY_ORDER.filter(function (w) { return repeat.indexOf(w) >= 0; })
      .map(function (w) { return WEEKDAY_KR[w]; }).join('·');
  }
  function memberTag(member) {
    var cls = member === 'choco' ? 'tag-pink' : member === 'hodori' ? 'tag-sky' : 'tag-mint';
    var name = member === 'all' ? '공통' : MEMBERS[member].name;
    return '<span class="tag ' + cls + '">' + esc(name) + '</span>';
  }
  function eventsOn(date) {
    var dk = dateKey(date);
    var wd = date.getDay();
    return state.events.filter(function (ev) {
      if (ev.repeat && ev.repeat.length) return ev.repeat.indexOf(wd) >= 0;
      return ev.date === dk;
    }).sort(byStart);
  }
  function timeToDate(date, hm) {
    var p = String(hm || '00:00').split(':');
    return new Date(date.getFullYear(), date.getMonth(), date.getDate(), Number(p[0]) || 0, Number(p[1]) || 0, 0, 0);
  }
  function nextOccurrences(limit, days) {
    var out = [], now = new Date();
    for (var i = 0; i < (days || 14); i++) {
      var d = new Date();
      d.setDate(d.getDate() + i);
      eventsOn(d).forEach(function (ev) {
        var start = timeToDate(d, ev.start);
        var end = timeToDate(d, ev.end || ev.start);
        if (end < now) return;
        out.push({ ev: ev, date: new Date(d.getTime()), start: start, end: end });
      });
    }
    out.sort(function (a, b) { return a.start - b.start; });
    return out.slice(0, limit || 3);
  }
  function whenLabel(occ) {
    var now = new Date();
    if (occ.start <= now && occ.end >= now) return '지금 진행 중';
    var mins = Math.round((occ.start - now) / 60000);
    if (mins <= 0) return '곧 시작';
    if (mins <= 45) return '준비 시간!';
    if (mins < 60) return mins + '분 뒤';
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h < 24) return h + '시간' + (m ? ' ' + m + '분' : '') + ' 뒤';
    return dayLabel(occ.date.toISOString());
  }
  function dayTitle(d) {
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WEEKDAY_KR[d.getDay()] + '요일' +
      (dateKey(d) === dateKey() ? ' · 오늘' : '');
  }

    var dim = new Date(y, m + 1, 0).getDate();
    var total = Math.ceil((startWd + dim) / 7) * 7;
    var start = new Date(y, m, 1 - startWd);
    var cells = '';
    for (var i = 0; i < total; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var dk = dateKey(d);
      var out = d.getMonth() !== m;
      var evs = eventsOn(d);
      var dots = evs.slice(0, 3).map(function (e) { return '<span class="cd-dot ' + e.member + '"></span>'; }).join('');
      if (evs.length > 3) dots += '<span class="cd-more">+' + (evs.length - 3) + '</span>';
      cells += '<button class="cal-day' + (out ? ' is-out' : '') + (dk === dateKey() ? ' is-today' : '') +
        (dk === calSelected ? ' is-selected' : '') + (d.getDay() === 0 ? ' sun' : '') +

      '<div class="cal-head"><div class="cal-month">' + y + '년 ' + (m + 1) + '월</div>' +
      '<div class="cal-nav"><button class="icon-btn" data-act="cal:prev" aria-label="이전 달">‹</button>' +

    captureEventForm();

  function saveEventForm(form) {
    var el = form.elements;
    var title = (el.title.value || '').trim();
    if (!title) { toast('일정 이름을 적어 주세요'); el.title.focus(); return; }
    var repeat = (evDraft.repeat || []).slice();
    var date = el.date.value || dateKey();
    var obj = {
      title: title, member: el.member.value, repeat: repeat,
      date: repeat.length ? null : date,
      start: el.start.value || '16:00', end: el.end.value || '',
      place: (el.place.value || '').trim(), prep: (el.prep.value || '').trim(),
      memo: (el.memo.value || '').trim(), example: false
    };
    if (evDraft.id) {
      var ev = state.events.find(function (x) { return x.id === evDraft.id; });
      if (ev) Object.assign(ev, obj);
    } else {
      state.events.push(Object.assign({ id: uid() }, obj));
    }
    calSelected = date;
    var d = parseDateKey(date);
    calView = { y: d.getFullYear(), m: d.getMonth() };
    modalState = null;
    closeModal();
    save();
    renderAll();
    toast(evDraft.id ? '일정을 고쳤어요 ✏️' : '일정을 추가했어요 🗓️');
  }

    var ev = state.events.find(function (x) { return x.id === id; });

      }
    });

  var WCODE = {

    71: '약한 눈', 73: '눈', 75: '많은 눈', 77: '눈', 80: '소나기', 81: '소나기', 82: '강한 소나기',
    85: '눈 소나기', 86: '눈 소나기', 95: '천둥번개', 96: '천둥번개', 99: '천둥번개'
  };
  function demoWeather() {
    return { temp: 11, min: 6, max: 15, code: 0, label: '맑음', pm25: 22, pm10: 34, isDemo: true, at: new Date().toISOString(), tempTip: '포근한 겉옷' };
  }
  function fetchJSON(url, ms) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, ms || 7000);
      fetch(url, { cache: 'no-store' }).then(function (r) {
        return r.json();
      }).then(function (j) {
        if (done) return;
        done = true; clearTimeout(timer); resolve(j);
      }).catch(function (e) {
        if (done) return;
        done = true; clearTimeout(timer); reject(e);
      });
    });
  }
  function loadWeather(force) {
    var w = state.weather;
    if (!force && w && !w.isDemo && w.at && Date.now() - new Date(w.at).getTime() < 30 * 60 * 1000) return;
    var lat = 37.5665, lon = 126.9780;
    var fcURL = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code,apparent_temperature&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=1';
    var aqURL = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon +
      '&current=pm10,pm2_5&timezone=Asia%2FSeoul';
    Promise.all([fetchJSON(fcURL), fetchJSON(aqURL).catch(function () { return null; })]).then(function (res) {
      var fc = res[0], aq = res[1];
      if (!fc || !fc.current || !fc.daily) throw new Error('bad weather');
      var code = Number(fc.current.weather_code);
      var temp = Number(fc.current.temperature_2m);
      var next = {
        temp: temp,
        min: Number(fc.daily.temperature_2m_min[0]),
        max: Number(fc.daily.temperature_2m_max[0]),
        code: code,
        label: WCODE[code] || '맑음',
        pm25: aq && aq.current ? Math.round(Number(aq.current.pm2_5)) : null,
        pm10: aq && aq.current ? Math.round(Number(aq.current.pm10)) : null,
        isDemo: false,
        at: new Date().toISOString(),
        tempTip: temp >= 28 ? '시원한 물' : temp <= 3 ? '따뜻한 옷' : '가벼운 겉옷'
      };
      state.weather = next;
      save();
      if (state.page === 'home') {
        var el = $('#weatherCard');
        if (el) el.outerHTML = weatherCardHTML();
      }
    }).catch(function () {
      if (!state.weather) state.weather = demoWeather();
      save();
      if (state.page === 'home') {
        var el = $('#weatherCard');
        if (el) el.outerHTML = weatherCardHTML();
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* 동작                                                               */
  /* ------------------------------------------------------------------ */
  function setPage(id) {
    if (!PAGES.some(function (p) { return p.id === id; })) return;
    state.page = id;
    if (id === 'allowance') ledgerMember = state.activeMember;
    saveSoon();
    renderNav();
    renderTopbar();
    renderPage();
    var scroller = $('.main-scroll');
    if (scroller) scroller.scrollTop = 0;
  }

  function setMember(id) {
    if (MEMBER_IDS.indexOf(id) < 0) return;
    state.activeMember = id;
    saveSoon();
    renderMembers();
    renderNav();
    renderPage();
    toast(MEMBERS[id].name + '으로 보는 중이에요 🐾');
  }

  function toggleMission(id) {
    var m = state.missions.items.find(function (x) { return x.id === id; });
    if (!m) return;
    m.done = !m.done;
    save();
    renderPage();
    if (m.done) toast('미션 완료! 멋져요 ✨');
  }

  function addTodo(text, kind) {
    text = (text || '').trim();
    if (!text) return;
    state.todos.push({ id: uid(), member: state.activeMember, text: text, kind: kind === 'study' ? 'study' : 'todo', target: kind === 'study' ? 10 : 0, done: false });
    save();
    renderPage();
    renderNav();
    toast('할 일을 추가했어요 📌');
  }

  function toggleTodo(id) {
    var t = state.todos.find(function (x) { return x.id === id; });
    if (!t) return;
    t.done = !t.done;
    save();
    renderPage();
    renderNav();
    if (t.done) toast('하나 끝! 최고예요 🎉');
  }

  function delTodo(id) {
    state.todos = state.todos.filter(function (x) { return x.id !== id; });
    save();
    renderPage();
    renderNav();
    toast('할 일을 지웠어요');
  }

  function timerStart() {
    var t = state.timer;
    if (t.running) return;
    t.running = true;
    t.startedAt = new Date().toISOString();
    save();
    renderPage();
  }
  function timerPause() {
    var t = state.timer;
    if (!t.running) return;
    t.baseMs = elapsedMs();
    t.running = false;
    t.startedAt = null;
    save();
    renderPage();
  }
  function timerReset() {
    state.timer.baseMs = 0;
    state.timer.running = false;
    state.timer.startedAt = null;
    save();
    renderPage();
    toast('타이머를 초기화했어요');
  }
  function timerMode(mode) {
    if (mode !== 'countdown' && mode !== 'stopwatch') return;
    state.timer.mode = mode;
    state.timer.baseMs = 0;
    state.timer.running = false;
    state.timer.startedAt = null;
    save();
    renderPage();
  }
  function timerPreset(min) {
    min = Number(min) || 10;
    state.timer.mode = 'countdown';
    state.timer.targetMin = min;
    state.timer.baseMs = 0;
    state.timer.running = false;
    state.timer.startedAt = null;
    save();
    renderPage();
  }

  function saveSession() {
    var mins = Math.floor(elapsedMs() / 60000);
    var id = state.activeMember;
    if (mins < 1) {
      toast('1분 이상 공부하면 기록할 수 있어요 ⏱️');
      return;
    }
    var stars = Math.floor(mins / 10);
    var earned = stars * REWARD_PER_10MIN;
    var at = new Date().toISOString();
    state.sessions.unshift({ id: uid(), member: id, minutes: mins, stars: stars, earned: earned, at: at });
    if (earned > 0) {
      state.ledger.unshift({ id: uid(), member: id, type: 'study', amount: earned, category: '공부 적립', memo: '공부 ' + mins + '분', at: at });
      state.members[id].stars += stars;
    }
    state.timer.baseMs = 0;
    state.timer.running = false;
    state.timer.startedAt = null;
    save();
    renderPage();
    renderMembers();
    toast(earned > 0
      ? MEMBERS[id].name + ' ' + mins + '분 공부! 별 ' + stars + '개 · ' + won(earned) + '원 적립 🎉'
      : MEMBERS[id].name + ' ' + mins + '분 기록! 10분을 채우면 용돈이 적립돼요');
  }

  function toggleStamp(id, index) {
    index = Number(index);
    if (MEMBER_IDS.indexOf(id) < 0 || isNaN(index) || index < 0 || index >= STAMP_COUNT) return;
    var arr = state.stamps[id];
    var wasOn = arr[index];
    arr[index] = !arr[index];
    var count = arr.filter(Boolean).length;
    if (!wasOn) {
      var milestone = [10, 20].find(function (n) { return count === n && state.milestones[id].indexOf(n) < 0; });
      if (milestone) {
        state.milestones[id].push(milestone);
        state.members[id].stars += 1;
        state.praise.unshift({
          id: uid(), from: id === 'choco' ? 'hodori' : 'choco', to: id, sticker: 'star',
          text: '도장 ' + milestone + '개를 모았어요! 정말 대단해요 ✨', at: new Date().toISOString()
        });
        toast('도장 ' + milestone + '개 달성! 별 1개와 칭찬 스티커를 받았어요 🌟');
      }
    }
    save();
    renderPage();
    renderMembers();
  }

  function resetBoard(id) {
    if (!MEMBER_IDS.indexOf(id) >= 0) return;
    state.stamps[id] = new Array(STAMP_COUNT).fill(false);
    save();
    renderPage();
    toast('새 도장판을 펼쳤어요 🐣');
  }

  function sendPraise(text) {
    var to = sendTo;
    var from = to === 'choco' ? 'hodori' : 'choco';
    state.praise.unshift({
      id: uid(), from: from, to: to, sticker: praiseSticker,
      text: (text || '').trim() || '칭찬 스티커를 보냈어요!', at: new Date().toISOString()
    });
    if (state.praise.filter(function (p) { return p.to === to; }).length % 5 === 0) state.members[to].stars += 1;
    save();
    renderPage();
    renderMembers();
    toast(MEMBERS[to].name + '에게 칭찬 스티커를 보냈어요 💌');
  }

  function addLedger(form) {
    var member = form.member.value;
    var type = form.type.value;
    var amount = Number(form.amount.value);
    if (MEMBER_IDS.indexOf(member) < 0 || !amount || amount <= 0) {
      toast('금액을 1원 이상 입력해 주세요');
      return;
    }
    var at = new Date().toISOString();
    state.ledger.unshift({
      id: uid(), member: member, type: type, amount: Math.round(amount),
      category: form.category.value, memo: (form.memo.value || '').trim(), at: at
    });
    ledgerMember = member;
    save();
    renderPage();
    renderMembers();
    toast((type === 'expense' ? '사용 ' : '입금 ') + won(amount) + '원을 기록했어요 ✏️');
  }

  function delLedger(id) {
    state.ledger = state.ledger.filter(function (e) { return e.id !== id; });
    save();
    renderPage();
    renderMembers();
    toast('내역을 지웠어요');
  }

  function setBase(id, value) {
    var v = Math.max(0, Math.round(Number(value) || 0));
    state.members[id].base = v;
    save();
    renderPage();
    renderMembers();
  }

  function claimBonus(id) {
    if (!bonusEligible(id)) return;
    var key = claimKey();
    if (!state.claims[key]) state.claims[key] = {};
    state.claims[key][id] = true;
    var at = new Date().toISOString();
    state.ledger.unshift({ id: uid(), member: id, type: 'study', amount: STUDY_BONUS, category: '공부 적립', memo: '공부 30분 보너스', at: at });
    save();
    renderPage();
    renderMembers();
    toast(MEMBERS[id].name + ' 보너스 ' + won(STUDY_BONUS) + '원 적립! 🎁');
  }

  function sendChat(text) {
    text = (text || '').trim();
    if (!text) return;
    var msg = { id: uid(), from: state.activeMember, type: 'text', tag: '건의', text: text, at: new Date().toISOString(), reactions: { confirm: [], doit: [] } };
    if (/먹고 싶|메뉴|간식|아침|저녁|점심/.test(text)) msg.tag = '건의';
    if (/\?$|어요\?|까\?/.test(text)) msg.tag = '질문';
    state.chat.push(msg);
    save();
    renderPage();
    var input = $('.compose-box .field');
    if (input) { input.value = ''; input.focus(); }
    scrollChat();
  }

  function sendSticker(key) {
    if (!STICKERS[key]) return;
    state.chat.push({ id: uid(), from: state.activeMember, type: 'sticker', sticker: key, text: '', at: new Date().toISOString(), reactions: { confirm: [], doit: [] } });
    chatStickerOpen = false;
    save();
    renderPage();
    scrollChat();
  }

  function toggleReact(msgId, kind) {
    var msg = state.chat.find(function (m) { return m.id === msgId; });
    if (!msg) return;
    if (!msg.reactions) msg.reactions = { confirm: [], doit: [] };
    if (!msg.reactions[kind]) msg.reactions[kind] = [];
    var arr = msg.reactions[kind];
    var i = arr.indexOf(state.activeMember);
    if (i >= 0) arr.splice(i, 1);
    else arr.push(state.activeMember);
    save();
    renderPage();
  }

  function exportJSON() {
    try {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '우리-가족-기록장-' + dateKey() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      toast('백업 파일을 내려받았어요 🍀');
    } catch (e) {
      toast('백업 파일을 만들 수 없어요');
    }
  }

  var pendingImport = null;
  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        if (!data || typeof data !== 'object' || !data.members) throw new Error('bad');
        pendingImport = data;
        openModal({
          title: '불러온 기록으로 바꿀까요?',
          body: '지금 저장된 기록은 사라지고, 백업 파일의 기록으로 바뀌어요.',
          ok: '불러오기',
          cancel: '그만두기'
        });
      } catch (e) {
        toast('기록 파일을 읽을 수 없어요 (JSON 아님)');
      }
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
  }

  function applyImport() {
    if (!pendingImport) return;
    var base = defaultState();
    state = normalize(pendingImport, base);
    state.page = 'home';
    pendingImport = null;
    save();
    renderAll();
    closeModal();
    toast('기록을 불러왔어요 🐣');
  }

  /* ------------------------------------------------------------------ */
  /* 이벤트                                                             */
  /* ------------------------------------------------------------------ */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var d = el.dataset;

    switch (act) {
      case 'nav:page': setPage(d.page); break;
      case 'academy:save': academySave(); break;
      case 'academy:done': academyDone(d.id); break;
      case 'academy:remove': academyRemove(d.id); break;
      case 'academy:exception': academyException(d.id,d.date); break;
      case 'garden:toggle': gardenToggle(d.member,d.kind,d.id); break;
      case 'garden:pay': gardenPay(d.member); break;
      case 'garden:reward': {var v=Number($('#gardenReward').value);if(!Number.isFinite(v)||v<100||v>100000){toast('100원~100,000원 사이로 입력해주세요');break;}if(!confirm('꽃 보상 금액을 바꾸면 기존 꽃의 적립금도 새 금액으로 계산됩니다. 변경할까요?'))break;state.garden.reward=Math.round(v);save();renderPage();toast('꽃 보상 금액을 변경했어요');break;}
      case 'dual:timer': dualTimerAction(d.op,d.member); break;
      case 'dual:preset': dualPreset(d.min); break;
      case 'admin:save': adminSaveNames(); break;
      case 'admin:move': adminMove(d.id, d.dir); break;
      case 'admin:toggle': adminToggle(d.id); break;
      case 'admin:reset': adminReset(); break;
      case 'nav:praise':
        sendTo = d.to === 'choco' ? 'choco' : 'hodori';
        setPage('stamps');
        break;
      case 'member:select': setMember(d.member); break;
      case 'mission:toggle': toggleMission(d.id); break;
      case 'routine:toggle': toggleRoutine(d.id); break;
      case 'routine:del': delRoutine(d.id); break;
      case 'routine:edit': editRoutine(d.id); break;
      case 'routine:preset': addRoutinePreset(d.text, d.slot); break;
      case 'preset:target': presetTarget = (d.member === 'choco' || d.member === 'hodori') ? d.member : 'both'; renderPage(); break;
      case 'preset:slot': presetSlot = d.slot === 'morning' ? 'morning' : 'afternoon'; renderPage(); break;
      case 'cal:prev': { calView.m -= 1; if (calView.m < 0) { calView.m = 11; calView.y -= 1; } renderPage(); break; }
      case 'cal:next': { calView.m += 1; if (calView.m > 11) { calView.m = 0; calView.y += 1; } renderPage(); break; }
      case 'cal:today': { var t = new Date(); calView = { y: t.getFullYear(), m: t.getMonth() }; calSelected = dateKey(); renderPage(); break; }
      case 'cal:select': { calSelected = d.date; var pd = parseDateKey(d.date); calView = { y: pd.getFullYear(), m: pd.getMonth() }; renderPage(); break; }
      case 'event:new': openEventModal(null, calSelected); break;
      case 'event:edit': openEventModal(d.id); break;
      case 'event:del': delEvent(d.id); break;
      case 'ev:wd': toggleEvWeekday(d.wd); break;
      case 'todo:toggle': toggleTodo(d.id); break;
      case 'todo:del': delTodo(d.id); break;
      case 'timer:start': timerStart(); break;
      case 'timer:pause': timerPause(); break;
      case 'timer:reset': timerReset(); break;
      case 'timer:mode': timerMode(d.mode); break;
      case 'timer:preset': timerPreset(d.min); break;
      case 'timer:save': saveSession(); break;
      case 'stamp:toggle': toggleStamp(d.member, d.index); break;
      case 'stamp:reset': resetBoard(d.member); break;
      case 'praise:to': sendTo = d.member; renderPage(); break;
      case 'praise:sticker': praiseSticker = d.key; renderPage(); break;
      case 'claim:bonus': claimBonus(d.member); break;
      case 'ledger:member':
        ledgerMember = d.member; renderPage(); break;
      case 'ledger:filter':
        ledgerFilter = d.filter; renderPage(); break;
      case 'ledger:del': delLedger(d.id); break;
      case 'chat:quick': {
        var input = $('.compose-box .field');
        if (input) { input.value = d.text; input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
        break;
      }
      case 'chat:sticker': sendSticker(d.key); break;
      case 'chat:drawer': chatStickerOpen = !chatStickerOpen; renderPage(); break;
      case 'chat:react': toggleReact(d.id, d.react); break;
      case 'weather:refresh': loadWeather(true); renderPage(); toast('날씨를 새로 불러오는 중이에요'); break;
      case 'backup:export': exportJSON(); break;
      case 'backup:import': {
        var fi = $('#importFile');
        if (fi) fi.click();
        break;
      }
      case 'modal:ok': {
        var fn = modalState && modalState.onOk;
        var mi = $('#modalInput');
        if (fn) fn(mi ? mi.value : undefined);
        else closeModal();
        break;
      }
      case 'modal:close': closeModal(); break;
      case 'modal:backdrop': if (e.target === el) closeModal(); break;
      default: break;
    }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (!form || !form.dataset || !form.dataset.form) return;
    e.preventDefault();
    var kind = form.dataset.form;
    if (kind === 'dual-todo') {
      var id=form.dataset.member, input=form.querySelector('[name=text]');
      if(MEMBER_IDS.indexOf(id)>=0&&input&&input.value.trim()){state.todos.push({id:uid(),member:id,text:input.value.trim(),kind:'todo',target:0,done:false});save();renderPage();renderNav();}
    } else if (kind === 'todo') {
      addTodo(form.text.value, form.kind.value);
      form.text.value = '';
      form.text.focus();
    } else if (kind === 'praise') {
      sendPraise(form.text.value);
      form.text.value = '';
    } else if (kind === 'ledger') {
      addLedger(form);
    } else if (kind === 'routine') {
      addRoutine(form);
    } else if (kind === 'event') {
      saveEventForm(form);
    } else if (kind === 'chat') {
      sendChat(form.text.value);
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.dataset) return;
    if (el.dataset.change === 'member:base') setBase(el.dataset.member, el.value);
    if (el.id === 'lgMember' && MEMBER_IDS.indexOf(el.value) >= 0) ledgerMember = el.value;
    if (el.id === 'importFile') {
      var f = el.files && el.files[0];
      handleImportFile(f);
      el.value = '';
    }
  });

  /* 타이머 표시 갱신 */
  var lastLeft = null;
  function tick() {
    if (!state) return;
    MEMBER_IDS.forEach(function(id){var dt=dualTimers[id];if(dt.running&&dualElapsed(id)>=dualTargetMin*60000){dt.baseMs=dualTargetMin*60000;dt.running=false;dt.startedAt=null;dualStore();toast(MEMBERS[id].name+' 공부 목표 달성!');}var clock=document.querySelector('[data-dual-clock="'+id+'"]');if(clock)clock.textContent=dualTimeText(id);});
    var t = state.timer;
    if (!t.running) { lastLeft = null; return; }
    var parts = timerParts();
    var disp = $('#timerDisplay');
    if (disp) disp.textContent = parts.text;
    if (t.mode === 'countdown') {
      var left = parts.left;
      if (lastLeft !== null && left < lastLeft && left <= 6000) {
        var sub = $('#timerSub');
        if (sub) sub.textContent = '거의 다 왔어요! 조금만 더 힘내요';
      }
      lastLeft = left;
      if (left <= 0) {
        t.baseMs = t.targetMin * 60000;
        t.running = false;
        t.startedAt = null;
        save();
        renderPage();
        toast('목표 시간을 채웠어요! 정말 잘했어요 🎉');
        return;
      }
    } else {
      lastLeft = null;
    }
  }

  /* ------------------------------------------------------------------ */
  /* 시작                                                               */
  /* ------------------------------------------------------------------ */
  function init() {
    state = loadState();
    state.page = 'together';
    ensureDaily();
    modalRoot = $('#modalRoot');
    renderAll();
    setSaveNote('자동 저장됨 · ' + (state.updatedAt ? timeHM(state.updatedAt) : '지금'));
    setInterval(tick, 500);
    loadWeather(false);
    setupCloud();
    window.addEventListener('beforeunload', function () { try { save(); } catch (e) {} });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalState) closeModal();
      if (e.key === 'Enter' && modalState && document.activeElement && document.activeElement.id === 'modalInput') {
        e.preventDefault();
        var okBtn = $('.modal .btn-primary');
        if (okBtn) okBtn.click();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); toast('저장했어요 💾'); }
    });
  }

  window.__FAMILY__ = {
    get state() { return state; },
    save: save,
    setPage: setPage,
    setMember: setMember,
    render: renderAll
  };

  init();
})();

</script>
</body>
</html>
